# Senarai hafalan: surah pilihan, bacaan asas dan surah lazim (Ad-Dhuha hingga An-Nas).
# Medan: id (unik), s (nombor surah), dari/hingga (julat ayat; lalai: seluruh surah), tajuk (lalai: nama surah),
#        kumpulan (pilihan | asas | lazim).
#
# Modul Hafalan ialah AUDIO SAHAJA: teks ayat tidak dimuatkan untuk mana-mana surah di sini. Setiap surah dipaparkan
# sebagai grid butang ayat (1 hingga akhir) untuk didengar, diulang dan ditanda. Semak teks dengan mushaf bercetak
# berlogo KDN atau aplikasi Smart Quran yang diperakui KDN. Sebab: Akta 326 (lihat nota akta-326). Teks Yaasin,
# Tahlil dan doa dalam app tidak terjejas; ia kekal di bawah satu juzuk.

# Surah pilihan: surah panjang yang lazim dibaca dan dihafal.
# audio: false = Mod Selamat (kandungan/dasar.yaml): surah ini dijejak sahaja dalam app; audionya dalam Smart Quran.
# Audio yang dibenarkan + teks dalam app mesti kurang daripada satu juzuk (bina.py menyemak).
