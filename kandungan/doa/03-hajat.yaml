# Doa hajat: jiwa & kesusahan, rezeki & hutang, ilmu & peperiksaan, keluarga, kesihatan, kematian.

- id: karb
  tajuk: Ketika ditimpa kesusahan besar
  kat: [jiwa]
  tag: [kesusahan, musibah, tekanan, cemas, karb]
  sumber: {jenis: hadis, ruj: "Sahih al-Bukhari, no. 6346", darjat: Sahih, url: "https://sunnah.com/bukhari:6346", nota: "Rasulullah ﷺ membacanya ketika dalam kesusahan."}
  teks: "لاَ إِلَهَ إِلاَّ اللَّهُ الْعَظِيمُ الْحَلِيمُ | لاَ إِلَهَ إِلاَّ اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ | لاَ إِلَهَ إِلاَّ اللَّهُ رَبُّ السَّمَوَاتِ | وَرَبُّ الأَرْضِ | وَرَبُّ الْعَرْشِ الْكَرِيمِ"
  frasa: "Tiada tuhan melainkan Allah Yang Maha Agung lagi Maha Penyantun | Tiada tuhan melainkan Allah, Tuhan Arasy yang agung | Tiada tuhan melainkan Allah, Tuhan sekalian langit | dan Tuhan bumi | dan Tuhan Arasy yang mulia"
  rumi: "Laa ilaaha illallaahul 'aziimul haliim, laa ilaaha illallaahu rabbul 'arsyil 'aziim, laa ilaaha illallaahu rabbus samaawaati wa rabbul ardhi wa rabbul 'arsyil kariim."
  makna: "Tiada tuhan melainkan Allah Yang Maha Agung lagi Maha Penyantun; tiada tuhan melainkan Allah, Tuhan Arasy yang agung; tiada tuhan melainkan Allah, Tuhan langit, Tuhan bumi dan Tuhan Arasy yang mulia."

- id: hamm-hazan
  tajuk: Ketika runsing, sedih dan dibebani hutang
  kat: [jiwa, rezeki]
  tag: [runsing, sedih, malas, hutang, kemurungan, tekanan, anxiety]
  sumber: {jenis: hadis, ruj: "Sahih al-Bukhari, no. 6369", darjat: Sahih, url: "https://sunnah.com/bukhari:6369"}
  teks: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ | مِنَ الْهَمِّ وَالْحَزَنِ | وَالْعَجْزِ وَالْكَسَلِ | وَالْجُبْنِ وَالْبُخْلِ | وَضَلَعِ الدَّيْنِ | وَغَلَبَةِ الرِّجَالِ"
  frasa: "Ya Allah, sesungguhnya aku berlindung kepada-Mu | daripada kerunsingan dan kesedihan | daripada kelemahan dan kemalasan | daripada sifat pengecut dan bakhil | daripada beban hutang | dan daripada dikuasai orang lain"
  rumi: "Allaahumma innii a'uudzu bika minal hammi wal hazan, wal 'ajzi wal kasal, wal jubni wal bukhl, wa dhala'id dain, wa ghalabatir rijaal."
  makna: "Ya Allah, aku berlindung kepada-Mu daripada kerunsingan dan kesedihan, kelemahan dan kemalasan, sifat pengecut dan bakhil, beban hutang, dan daripada dikuasai orang lain."

- id: rahmataka-arju
  tajuk: Doa orang yang dalam kesempitan
  kat: [jiwa]
  tag: [kesusahan, tekanan, tawakal, buntu]
  sumber: {jenis: hadis, ruj: "Sunan Abi Dawud, no. 5090", darjat: Hasan, url: "https://sunnah.com/abudawud:5090", nota: "Disebut sebagai \"doa orang yang ditimpa kesusahan\"; sanadnya hasan menurut al-Albani."}
  teks: "اللَّهُمَّ رَحْمَتَكَ أَرْجُو | فَلاَ تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ | وَأَصْلِحْ لِي شَأْنِي كُلَّهُ | لاَ إِلَهَ إِلاَّ أَنْتَ"
  frasa: "Ya Allah, rahmat-Mu yang aku harapkan | maka janganlah Engkau serahkan aku kepada diriku walau sekelip mata | dan perbaikilah segala urusanku | tiada tuhan melainkan Engkau"
  rumi: "Allaahumma rahmataka arjuu, falaa takilnii ilaa nafsii tarfata 'ain, wa aslih lii sya'nii kullah, laa ilaaha illaa ant."
  makna: "Ya Allah, hanya rahmat-Mu yang aku harapkan; jangan Engkau serahkan aku kepada diriku walau sekelip mata, dan perbaikilah segala urusanku. Tiada tuhan melainkan Engkau."

- id: abduka-ibnu-abdik
  tajuk: Ketika dukacita mendalam
  kat: [jiwa]
  tag: [sedih, dukacita, kemurungan, al-quran, ketenangan]
  sumber: {jenis: hadis, ruj: "Musnad Ahmad 1/391 (no. 3712); Hisn al-Muslim no. 120", darjat: Sahih, url: "https://sunnah.com/hisn:120", nota: "Disahihkan oleh al-Albani. Allah akan menghilangkan dukacitanya dan menggantikannya dengan kegembiraan."}
  teks: "اللَّهُمَّ إِنِّي عَبْدُكَ ابْنُ عَبْدِكَ ابْنُ أَمَتِكَ | نَاصِيَتِي بِيَدِكَ | مَاضٍ فِيَّ حُكْمُكَ | عَدْلٌ فِيَّ قَضَاؤُكَ | أَسْأَلُكَ بِكُلِّ اسْمٍ هُوَ لَكَ | سَمَّيْتَ بِهِ نَفْسَكَ | أَوْ أَنْزَلْتَهُ فِي كِتَابِكَ | أَوْ عَلَّمْتَهُ أَحَدًا مِنْ خَلْقِكَ | أَوِ اسْتَأْثَرْتَ بِهِ فِي عِلْمِ الْغَيْبِ عِنْدَكَ | أَنْ تَجْعَلَ الْقُرْآنَ رَبِيعَ قَلْبِي | وَنُورَ صَدْرِي | وَجَلاَءَ حُزْنِي | وَذَهَابَ هَمِّي"
  frasa: "Ya Allah, sesungguhnya aku hamba-Mu, anak hamba lelaki-Mu, anak hamba perempuan-Mu | ubun-ubunku di tangan-Mu | berlaku ke atasku hukum-Mu | adil ke atasku ketetapan-Mu | Aku memohon kepada-Mu dengan setiap nama milik-Mu | yang Engkau namakan diri-Mu dengannya | atau yang Engkau turunkan dalam kitab-Mu | atau yang Engkau ajarkan kepada seseorang daripada makhluk-Mu | atau yang Engkau simpan dalam ilmu ghaib di sisi-Mu | agar Engkau jadikan al-Quran penyubur hatiku | dan cahaya dadaku | dan penghilang kesedihanku | dan pelenyap kerunsinganku"
  rumi: "Allaahumma innii 'abduka ibnu 'abdika ibnu amatik, naashiyatii biyadik, maadhin fiyya hukmuk, 'adlun fiyya qadhaa'uk, as'aluka bikullismin huwa lak, sammaita bihii nafsak, au anzaltahuu fii kitaabik, au 'allamtahuu ahadan min khalqik, awista'tsarta bihii fii 'ilmil ghaibi 'indak, an taj'alal qur'aana rabii'a qalbii, wa nuura sadrii, wa jalaa'a huznii, wa dzahaaba hammii."
  makna: "Ya Allah, aku hamba-Mu, anak kepada hamba-hamba-Mu; ubun-ubunku di tangan-Mu, hukum-Mu berlaku ke atasku dan ketetapan-Mu adil terhadapku. Aku memohon dengan setiap nama-Mu — yang Engkau namakan diri-Mu, yang Engkau turunkan dalam kitab-Mu, yang Engkau ajarkan kepada makhluk-Mu, atau yang Engkau simpan dalam ilmu ghaib — agar Engkau jadikan al-Quran penyubur hatiku, cahaya dadaku, penghilang kesedihanku dan pelenyap kerunsinganku."

- id: musibah
  tajuk: Ketika ditimpa musibah
  kat: [jiwa, kematian]
  tag: [musibah, kehilangan, kematian, bencana, sabar]
  sumber: {jenis: hadis, ruj: "Sahih Muslim, no. 918a", darjat: Sahih, url: "https://sunnah.com/muslim:918a", nota: "Allah akan menggantikan dengan yang lebih baik (kisah Ummu Salamah r.a.)."}
  teks: "إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ | اللَّهُمَّ أْجُرْنِي فِي مُصِيبَتِي | وَأَخْلِفْ لِي خَيْرًا مِنْهَا"
  frasa: "Sesungguhnya kami milik Allah dan kepada-Nya kami kembali | Ya Allah, berilah aku pahala dalam musibahku | dan gantikanlah bagiku yang lebih baik daripadanya"
  rumi: "Innaa lillaahi wa innaa ilaihi raaji'uun. Allaahumma'jurnii fii mushiibatii wa akhlif lii khairan minhaa."
  makna: "Sesungguhnya kami milik Allah dan kepada-Nya kami kembali. Ya Allah, berilah aku pahala atas musibahku dan gantikanlah bagiku yang lebih baik daripadanya."

- id: istikharah
  tajuk: Doa istikharah
  kat: [jiwa]
  tag: [keputusan, istikharah, jodoh, kerja, pilihan]
  bila: "Selepas solat sunat dua rakaat; sebut hajat pada perkataan \"hadzal amra\""
  sumber: {jenis: hadis, ruj: "Sahih al-Bukhari, no. 1166", darjat: Sahih, url: "https://sunnah.com/bukhari:1166"}
  teks: "اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ | وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ | وَأَسْأَلُكَ مِنْ فَضْلِكَ الْعَظِيمِ | فَإِنَّكَ تَقْدِرُ وَلاَ أَقْدِرُ | وَتَعْلَمُ وَلاَ أَعْلَمُ | وَأَنْتَ عَلاَّمُ الْغُيُوبِ | اللَّهُمَّ إِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الأَمْرَ | خَيْرٌ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي | فَاقْدُرْهُ لِي وَيَسِّرْهُ لِي | ثُمَّ بَارِكْ لِي فِيهِ | وَإِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الأَمْرَ | شَرٌّ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي | فَاصْرِفْهُ عَنِّي وَاصْرِفْنِي عَنْهُ | وَاقْدُرْ لِي الْخَيْرَ حَيْثُ كَانَ | ثُمَّ أَرْضِنِي بِهِ"
  frasa: "Ya Allah, aku memohon pilihan-Mu dengan ilmu-Mu | dan memohon kekuatan dengan kekuasaan-Mu | dan aku memohon kurnia-Mu yang agung | kerana Engkau berkuasa sedangkan aku tidak berkuasa | dan Engkau mengetahui sedangkan aku tidak mengetahui | dan Engkaulah Yang Maha Mengetahui perkara ghaib | Ya Allah, jika Engkau mengetahui bahawa urusan ini | baik bagiku pada agamaku, kehidupanku dan kesudahan urusanku | maka takdirkanlah ia untukku dan mudahkanlah ia bagiku | kemudian berkatilah aku padanya | Dan jika Engkau mengetahui bahawa urusan ini | buruk bagiku pada agamaku, kehidupanku dan kesudahan urusanku | maka jauhkanlah ia daripadaku dan jauhkanlah aku daripadanya | dan takdirkanlah kebaikan untukku di mana sahaja ia berada | kemudian jadikanlah aku reda dengannya"
  rumi: "Allaahumma innii astakhiiruka bi'ilmik, wa astaqdiruka biqudratik, wa as'aluka min fadhlikal 'aziim, fa innaka taqdiru wa laa aqdir, wa ta'lamu wa laa a'lam, wa anta 'allaamul ghuyuub. Allaahumma in kunta ta'lamu anna haadzal amra khairun lii fii diinii wa ma'aasyii wa 'aaqibati amrii, faqdurhu lii wa yassirhu lii, tsumma baarik lii fiih. Wa in kunta ta'lamu anna haadzal amra syarrun lii fii diinii wa ma'aasyii wa 'aaqibati amrii, fasrifhu 'annii wasrifnii 'anh, waqdur liyal khaira haitsu kaan, tsumma ardhinii bih."
  makna: "Ya Allah, aku memohon pilihan-Mu dengan ilmu-Mu, kekuatan dengan kekuasaan-Mu, dan kurnia-Mu yang agung; Engkau berkuasa sedangkan aku tidak, Engkau mengetahui sedangkan aku tidak, dan Engkaulah Yang Maha Mengetahui yang ghaib. Ya Allah, jika urusan ini baik bagi agamaku, kehidupanku dan kesudahanku, takdirkan dan mudahkanlah ia bagiku serta berkatilah; jika ia buruk, jauhkanlah ia daripadaku dan jauhkan aku daripadanya, takdirkanlah kebaikan di mana jua ia berada, dan jadikanlah aku reda dengannya."

- id: muqallibal-qulub
  tajuk: Tetapkan hati di atas agama
  kat: [jiwa]
  tag: [iman, istiqamah, hati, fitnah]
  sumber: {jenis: hadis, ruj: "Jami' at-Tirmizi, no. 2140", darjat: Hasan, url: "https://sunnah.com/tirmidhi:2140", nota: "At-Tirmizi menilainya hasan; Rasulullah ﷺ banyak membacanya."}
  teks: "يَا مُقَلِّبَ الْقُلُوبِ | ثَبِّتْ قَلْبِي عَلَى دِينِكَ"
  frasa: "Wahai Tuhan yang membolak-balikkan hati | tetapkanlah hatiku di atas agama-Mu"
  rumi: "Yaa muqallibal quluub, tsabbit qalbii 'alaa diinik."
  makna: "Wahai Tuhan yang membolak-balikkan hati, tetapkanlah hatiku di atas agama-Mu."

- id: huda-tuqa
  tajuk: Memohon petunjuk, takwa dan kecukupan
  kat: [jiwa]
  tag: [hidayah, takwa, kecukupan, rezeki]
  sumber: {jenis: hadis, ruj: "Sahih Muslim, no. 2721a", darjat: Sahih, url: "https://sunnah.com/muslim:2721a"}
  teks: "اللَّهُمَّ إِنِّي أَسْأَلُكَ | الْهُدَى وَالتُّقَى | وَالْعَفَافَ وَالْغِنَى"
  frasa: "Ya Allah, sesungguhnya aku memohon kepada-Mu | petunjuk dan ketakwaan | dan kehormatan diri serta kecukupan"
  rumi: "Allaahumma innii as'alukal hudaa wat tuqaa wal 'afaafa wal ghinaa."
  makna: "Ya Allah, aku memohon petunjuk, ketakwaan, kesucian diri dan kecukupan."

- id: zawal-nimah
  tajuk: Berlindung daripada hilang nikmat
  kat: [jiwa, perlindungan]
  tag: [nikmat, bencana, kemurkaan, kesihatan]
  sumber: {jenis: hadis, ruj: "Sahih Muslim, no. 2739", darjat: Sahih, url: "https://sunnah.com/muslim:2739"}
  teks: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ | مِنْ زَوَالِ نِعْمَتِكَ | وَتَحَوُّلِ عَافِيَتِكَ | وَفُجَاءَةِ نِقْمَتِكَ | وَجَمِيعِ سَخَطِكَ"
  frasa: "Ya Allah, sesungguhnya aku berlindung kepada-Mu | daripada hilangnya nikmat-Mu | dan berubahnya afiat-Mu | dan datangnya hukuman-Mu secara tiba-tiba | dan daripada segala kemurkaan-Mu"
  rumi: "Allaahumma innii a'uudzu bika min zawaali ni'matik, wa tahawwuli 'aafiyatik, wa fujaa'ati niqmatik, wa jamii'i sakhatik."
  makna: "Ya Allah, aku berlindung kepada-Mu daripada hilangnya nikmat-Mu, berubahnya afiat-Mu, hukuman-Mu yang datang tiba-tiba, dan segala kemurkaan-Mu."

- id: empat-perkara
  tajuk: Berlindung daripada empat perkara
  kat: [solat, perlindungan]
  tag: [tasyahhud, kubur, dajjal, fitnah]
  bila: "Selepas tasyahhud akhir, sebelum salam"
  sumber: {jenis: hadis, ruj: "Sahih Muslim, no. 588a", darjat: Sahih, url: "https://sunnah.com/muslim:588a"}
  teks: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ | مِنْ عَذَابِ جَهَنَّمَ | وَمِنْ عَذَابِ الْقَبْرِ | وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ | وَمِنْ شَرِّ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ"
  frasa: "Ya Allah, sesungguhnya aku berlindung kepada-Mu | daripada azab neraka Jahannam | dan daripada azab kubur | dan daripada fitnah kehidupan dan kematian | dan daripada kejahatan fitnah al-Masih ad-Dajjal"
  rumi: "Allaahumma innii a'uudzu bika min 'adzaabi jahannam, wa min 'adzaabil qabr, wa min fitnatil mahyaa wal mamaat, wa min syarri fitnatil masiihid dajjaal."
  makna: "Ya Allah, aku berlindung kepada-Mu daripada azab Jahannam, azab kubur, fitnah hidup dan mati, dan kejahatan fitnah al-Masih ad-Dajjal."

- id: marah
  tajuk: Ketika marah
  kat: [jiwa]
  tag: [marah, emosi, sabar]
  sumber: {jenis: hadis, ruj: "Sahih al-Bukhari, no. 6115", darjat: Sahih, url: "https://sunnah.com/bukhari:6115"}
  teks: "أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ"
  frasa: "Aku berlindung kepada Allah daripada syaitan yang direjam"
  rumi: "A'uudzu billaahi minasy syaitaanir rajiim."
  makna: "Aku berlindung kepada Allah daripada syaitan yang direjam."

- id: rabbighfirli-tub
  tajuk: Istighfar Nabi ﷺ dalam majlis
  kat: [jiwa]
  tag: [istighfar, taubat]
  ulang: 100
  sumber: {jenis: hadis, ruj: "Sunan Abi Dawud, no. 1516", darjat: Sahih, url: "https://sunnah.com/abudawud:1516", nota: "Ibn Umar menghitung Rasulullah ﷺ membacanya 100 kali dalam satu majlis. Disahihkan oleh al-Albani."}
  teks: "رَبِّ اغْفِرْ لِي | وَتُبْ عَلَىَّ | إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ"
  frasa: "Wahai Tuhanku, ampunilah aku | dan terimalah taubatku | sesungguhnya Engkau Maha Penerima taubat lagi Maha Mengasihani"
  rumi: "Rabbighfir lii wa tub 'alayya innaka antat tawwaabur rahiim."
  makna: "Wahai Tuhanku, ampunilah aku dan terimalah taubatku; sesungguhnya Engkau Maha Penerima taubat lagi Maha Mengasihani."

- id: hutang-ikfini
  tajuk: Doa melangsaikan hutang
  kat: [rezeki]
  tag: [hutang, rezeki, halal, kewangan]
  sumber: {jenis: hadis, ruj: "Jami' at-Tirmizi, no. 3563", darjat: Hasan, url: "https://sunnah.com/tirmidhi:3563", nota: "Diajar oleh Ali r.a. kepada seorang hamba mukatab: Allah akan melangsaikan hutangnya walaupun sebesar gunung."}
  teks: "اللَّهُمَّ اكْفِنِي بِحَلاَلِكَ عَنْ حَرَامِكَ | وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ"
  frasa: "Ya Allah, cukupkanlah aku dengan yang halal daripada-Mu sehingga tidak memerlukan yang haram | dan kayakanlah aku dengan kurnia-Mu sehingga tidak bergantung kepada selain-Mu"
  rumi: "Allaahummakfinii bihalaalika 'an haraamik, wa aghninii bifadhlika 'amman siwaak."
  makna: "Ya Allah, cukupkanlah aku dengan rezeki halal-Mu sehingga aku tidak memerlukan yang haram, dan kayakanlah aku dengan kurnia-Mu sehingga aku tidak bergantung kepada selain-Mu."

- id: ilmu-rezeki-amal
  tajuk: Ilmu bermanfaat, rezeki baik, amal diterima
  kat: [ilmu, rezeki]
  tag: [ilmu, rezeki, kerja, pelajar, subuh]
  bila: "Selepas salam solat Subuh"
  sumber: {jenis: hadis, ruj: "Sunan Ibn Majah, no. 925", darjat: Sahih, url: "https://sunnah.com/ibnmajah:925"}
  teks: "اللَّهُمَّ إِنِّي أَسْأَلُكَ | عِلْمًا نَافِعًا | وَرِزْقًا طَيِّبًا | وَعَمَلاً مُتَقَبَّلاً"
  frasa: "Ya Allah, sesungguhnya aku memohon kepada-Mu | ilmu yang bermanfaat | dan rezeki yang baik | dan amalan yang diterima"
  rumi: "Allaahumma innii as'aluka 'ilman naafi'aa, wa rizqan tayyibaa, wa 'amalan mutaqabbalaa."
  makna: "Ya Allah, aku memohon ilmu yang bermanfaat, rezeki yang baik dan amalan yang diterima."

- id: ilmu-la-yanfa
  tajuk: Berlindung daripada ilmu yang tidak bermanfaat
  kat: [ilmu, jiwa]
  tag: [ilmu, hati, khusyuk, pelajar]
  sumber: {jenis: hadis, ruj: "Sahih Muslim, no. 2722", darjat: Sahih, url: "https://sunnah.com/muslim:2722"}
  teks: "اللَّهُمَّ آتِ نَفْسِي تَقْوَاهَا | وَزَكِّهَا أَنْتَ خَيْرُ مَنْ زَكَّاهَا | أَنْتَ وَلِيُّهَا وَمَوْلاَهَا | اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عِلْمٍ لاَ يَنْفَعُ | وَمِنْ قَلْبٍ لاَ يَخْشَعُ | وَمِنْ نَفْسٍ لاَ تَشْبَعُ | وَمِنْ دَعْوَةٍ لاَ يُسْتَجَابُ لَهَا"
  frasa: "Ya Allah, kurniakanlah jiwaku ketakwaannya | dan sucikanlah ia, Engkaulah sebaik-baik yang menyucikannya | Engkaulah pelindung dan penguasanya | Ya Allah, aku berlindung kepada-Mu daripada ilmu yang tidak bermanfaat | dan daripada hati yang tidak khusyuk | dan daripada nafsu yang tidak pernah puas | dan daripada doa yang tidak dimakbulkan"
  rumi: "Allaahumma aati nafsii taqwaahaa, wa zakkihaa anta khairu man zakkaahaa, anta waliyyuhaa wa maulaahaa. Allaahumma innii a'uudzu bika min 'ilmin laa yanfa', wa min qalbin laa yakhsya', wa min nafsin laa tasyba', wa min da'watin laa yustajaabu lahaa."
  makna: "Ya Allah, kurniakanlah ketakwaan kepada jiwaku dan sucikanlah ia — Engkaulah sebaik-baik penyuci, pelindung dan penguasanya. Ya Allah, aku berlindung kepada-Mu daripada ilmu yang tidak bermanfaat, hati yang tidak khusyuk, nafsu yang tidak pernah puas dan doa yang tidak dimakbulkan."

- id: sahla
  tajuk: Memohon kemudahan urusan (peperiksaan, temuduga)
  kat: [ilmu, jiwa]
  tag: [peperiksaan, spm, temuduga, urusan sukar, kemudahan]
  sumber: {jenis: hadis, ruj: "Sahih Ibn Hibban, no. 2427; Ibn as-Sunni no. 351; Hisn al-Muslim no. 139", darjat: Sahih, url: "https://sunnah.com/hisn:139", nota: "Disahihkan oleh al-Hafiz Ibn Hajar."}
  teks: "اللَّهُمَّ لاَ سَهْلَ | إِلاَّ مَا جَعَلْتَهُ سَهْلاً | وَأَنْتَ تَجْعَلُ الْحَزْنَ | إِذَا شِئْتَ سَهْلاً"
  frasa: "Ya Allah, tiada yang mudah | melainkan apa yang Engkau jadikannya mudah | dan Engkaulah yang menjadikan perkara yang sukar | jika Engkau kehendaki, menjadi mudah"
  rumi: "Allaahumma laa sahla illaa maa ja'altahuu sahlaa, wa anta taj'alul hazna idzaa syi'ta sahlaa."
  makna: "Ya Allah, tiada yang mudah melainkan apa yang Engkau jadikan mudah, dan Engkaulah yang menjadikan perkara sukar mudah apabila Engkau kehendaki."

- id: pengantin
  tajuk: Doa untuk pengantin
  kat: [keluarga, majlis]
  tag: [perkahwinan, nikah, pengantin, walimah]
  sumber: {jenis: hadis, ruj: "Sunan Abi Dawud, no. 2130", darjat: Sahih, url: "https://sunnah.com/abudawud:2130", nota: "Ucapan Rasulullah ﷺ kepada orang yang baru berkahwin."}
  teks: "بَارَكَ اللَّهُ لَكَ | وَبَارَكَ عَلَيْكَ | وَجَمَعَ بَيْنَكُمَا فِي خَيْرٍ"
  frasa: "Semoga Allah memberkatimu | dan melimpahkan keberkatan ke atasmu | dan menghimpunkan kamu berdua dalam kebaikan"
  rumi: "Baarakallaahu laka wa baaraka 'alaika wa jama'a bainakumaa fii khair."
  makna: "Semoga Allah memberkatimu, melimpahkan keberkatan ke atasmu, dan menghimpunkan kamu berdua dalam kebaikan."

- id: anak-perlindungan
  tajuk: Pendinding untuk anak-anak
  kat: [keluarga, perlindungan]
  tag: [anak, bayi, kelahiran, ain, pendinding]
  sumber: {jenis: hadis, ruj: "Sunan Abi Dawud, no. 4737; Sahih al-Bukhari, no. 3371", darjat: Sahih, url: "https://sunnah.com/abudawud:4737", nota: "Rasulullah ﷺ membacanya untuk al-Hasan dan al-Husain (أُعِيذُكُمَا). Untuk seorang anak: أُعِيذُكَ (lelaki) / أُعِيذُكِ (perempuan)."}
  teks: "أُعِيذُكُمَا بِكَلِمَاتِ اللَّهِ التَّامَّةِ | مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ | وَمِنْ كُلِّ عَيْنٍ لاَمَّةٍ"
  frasa: "Aku memohon perlindungan untuk kamu berdua dengan kalimah-kalimah Allah yang sempurna | daripada setiap syaitan dan binatang berbisa | dan daripada setiap mata yang jahat (ain)"
  rumi: "U'iidzukumaa bikalimaatillaahit taammah, min kulli syaitaanin wa haammah, wa min kulli 'ainin laammah."
  makna: "Aku memohon perlindungan untuk kamu berdua dengan kalimah-kalimah Allah yang sempurna daripada setiap syaitan, binatang berbisa dan pandangan mata yang jahat."

- id: ruqyah-rabban-nas
  tajuk: Doa untuk orang sakit (ruqyah)
  kat: [sakit]
  tag: [sakit, pesakit, ruqyah, penyembuhan, ziarah hospital]
  bila: "Sambil menyapu tangan kanan pada tempat sakit"
  sumber: {jenis: hadis, ruj: "Sahih al-Bukhari, no. 5743", darjat: Sahih, url: "https://sunnah.com/bukhari:5743"}
  teks: "اللَّهُمَّ رَبَّ النَّاسِ | أَذْهِبِ الْبَاسَ | اشْفِهِ وَأَنْتَ الشَّافِي | لاَ شِفَاءَ إِلاَّ شِفَاؤُكَ | شِفَاءً لاَ يُغَادِرُ سَقَمًا"
  frasa: "Ya Allah, Tuhan sekalian manusia | hilangkanlah penyakit ini | sembuhkanlah dia, Engkaulah Yang Maha Menyembuhkan | tiada penyembuhan melainkan penyembuhan-Mu | penyembuhan yang tidak meninggalkan sebarang penyakit"
  rumi: "Allaahumma rabban naas, adzhibil ba's, isyfihi wa antasy syaafii, laa syifaa'a illaa syifaa'uk, syifaa'an laa yughaadiru saqamaa."
  makna: "Ya Allah, Tuhan sekalian manusia, hilangkanlah penyakit ini dan sembuhkanlah dia; Engkaulah Yang Maha Menyembuhkan, tiada penyembuhan melainkan penyembuhan-Mu, penyembuhan yang tidak meninggalkan sebarang penyakit."

- id: ziarah-sakit
  tajuk: Ketika menziarahi pesakit
  kat: [sakit]
  tag: [ziarah, pesakit, hospital, demam]
  sumber: {jenis: hadis, ruj: "Sahih al-Bukhari, no. 5656; Sunan Abi Dawud, no. 3106", darjat: Sahih, url: "https://sunnah.com/abudawud:3106", nota: "Abu Dawud 3106 (disahihkan al-Albani): jika dibaca 7 kali di sisi pesakit yang belum tiba ajalnya, Allah akan menyembuhkannya."}
  bahagian:
    - tajuk: Ucapan kepada pesakit
      teks: "لاَ بَأْسَ | طَهُورٌ إِنْ شَاءَ اللَّهُ"
      frasa: "Tidak mengapa | (sakit ini) penyucian (dosa), insya-Allah"
      rumi: "Laa ba'sa, tahuurun in syaa'allaah."
      makna: "Tidak mengapa; (sakit ini) menyucikan dosa, insya-Allah."
    - tajuk: Doa 7 kali
      ulang: 7
      teks: "أَسْأَلُ اللَّهَ الْعَظِيمَ | رَبَّ الْعَرْشِ الْعَظِيمِ | أَنْ يَشْفِيَكَ"
      frasa: "Aku memohon kepada Allah Yang Maha Agung | Tuhan Arasy yang agung | agar Dia menyembuhkanmu"
      rumi: "As'alullaahal 'aziim, rabbal 'arsyil 'aziim, an yasyfiyak."
      makna: "Aku memohon kepada Allah Yang Maha Agung, Tuhan Arasy yang agung, agar Dia menyembuhkanmu."

- id: sakit-badan
  tajuk: Ketika merasa sakit pada badan
  kat: [sakit]
  tag: [sakit, sakit sendiri, kesakitan]
  bila: "Letak tangan pada tempat yang sakit"
  sumber: {jenis: hadis, ruj: "Sahih Muslim, no. 2202", darjat: Sahih, url: "https://sunnah.com/muslim:2202"}
  bahagian:
    - teks: "بِاسْمِ اللَّهِ"
      frasa: "Dengan nama Allah"
      rumi: "Bismillaah."
      makna: "Dengan nama Allah."
      ulang: 3
    - teks: "أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ | مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ"
      frasa: "Aku berlindung kepada Allah dan kekuasaan-Nya | daripada keburukan yang aku rasai dan aku bimbangi"
      rumi: "A'uudzu billaahi wa qudratihii min syarri maa ajidu wa uhaadzir."
      makna: "Aku berlindung kepada Allah dan kekuasaan-Nya daripada keburukan yang aku rasai dan yang aku bimbangi."
      ulang: 7

- id: afiat-badan
  tajuk: Memohon afiat badan, pendengaran dan penglihatan
  kat: [sakit, pagi-petang]
  tag: [kesihatan, pagi, petang, warga emas]
  ulang: 3
  bila: "Pagi dan petang, 3 kali"
  sumber: {jenis: hadis, ruj: "Sunan Abi Dawud, no. 5090", darjat: Hasan, url: "https://sunnah.com/abudawud:5090", nota: "Abu Bakrah r.a. membacanya setiap pagi dan petang mengikut sunnah Nabi ﷺ; sanad hasan menurut al-Albani."}
  teks: "اللَّهُمَّ عَافِنِي فِي بَدَنِي | اللَّهُمَّ عَافِنِي فِي سَمْعِي | اللَّهُمَّ عَافِنِي فِي بَصَرِي | لاَ إِلَهَ إِلاَّ أَنْتَ"
  frasa: "Ya Allah, sihatkanlah tubuh badanku | Ya Allah, sihatkanlah pendengaranku | Ya Allah, sihatkanlah penglihatanku | tiada tuhan melainkan Engkau"
  rumi: "Allaahumma 'aafinii fii badanii, Allaahumma 'aafinii fii sam'ii, Allaahumma 'aafinii fii basharii, laa ilaaha illaa ant."
  makna: "Ya Allah, kurniakanlah afiat pada tubuh badanku, pendengaranku dan penglihatanku; tiada tuhan melainkan Engkau."

- id: wabak-penyakit
  tajuk: Berlindung daripada penyakit berat
  kat: [sakit, alam]
  tag: [wabak, penyakit, pandemik, kesihatan]
  sumber: {jenis: hadis, ruj: "Sunan Abi Dawud, no. 1554", darjat: Sahih, url: "https://sunnah.com/abudawud:1554", nota: "Disahihkan oleh al-Albani; antara doa yang disyorkan ketika wabak."}
  teks: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ | مِنَ الْبَرَصِ وَالْجُنُونِ | وَالْجُذَامِ | وَمِنْ سَيِّئِ الأَسْقَامِ"
  frasa: "Ya Allah, sesungguhnya aku berlindung kepada-Mu | daripada penyakit sopak dan gila | dan kusta | dan daripada segala penyakit yang buruk"
  rumi: "Allaahumma innii a'uudzu bika minal barashi wal junuun, wal judzaam, wa min sayyi'il asqaam."
  makna: "Ya Allah, aku berlindung kepada-Mu daripada penyakit sopak, gila, kusta dan segala penyakit yang buruk."

- id: takziah
  tajuk: Ucapan takziah
  kat: [kematian]
  tag: [takziah, kematian, kehilangan, kanak-kanak, sabar]
  sumber: {jenis: hadis, ruj: "Sahih al-Bukhari, no. 1284", darjat: Sahih, url: "https://sunnah.com/bukhari:1284", nota: "Pesanan Rasulullah ﷺ kepada puterinya yang kematian anak."}
  teks: "إِنَّ لِلَّهِ مَا أَخَذَ | وَلَهُ مَا أَعْطَى | وَكُلٌّ عِنْدَهُ بِأَجَلٍ مُسَمًّى | فَلْتَصْبِرْ وَلْتَحْتَسِبْ"
  frasa: "Sesungguhnya milik Allah apa yang Dia ambil | dan milik-Nya apa yang Dia beri | dan setiap sesuatu di sisi-Nya ada ajal yang ditentukan | maka bersabarlah dan harapkanlah pahala"
  rumi: "Inna lillaahi maa akhadz, wa lahuu maa a'thaa, wa kullun 'indahuu bi ajalin musammaa, faltashbir waltahtasib."
  makna: "Sesungguhnya milik Allah apa yang Dia ambil dan milik-Nya apa yang Dia beri; setiap sesuatu di sisi-Nya ada ajal yang ditentukan. Maka bersabarlah dan harapkanlah pahala."

- id: doa-jenazah
  tajuk: Doa untuk jenazah
  kat: [kematian]
  tag: [jenazah, solat jenazah, kematian, arwah]
  bila: "Takbir ketiga solat jenazah; juga sesuai di sisi kubur"
  sumber: {jenis: hadis, ruj: "Sahih Muslim, no. 963a", darjat: Sahih, url: "https://sunnah.com/muslim:963a", nota: "Untuk jenazah perempuan: tukar dhamir kepada ـهَا (lahaa, warhamhaa…). Lafaz asal hujung hadis: أَوْ مِنْ عَذَابِ النَّارِ (keraguan perawi); dibaca وَمِنْ mengikut amalan lazim.", semak_kecuali: ["وَمِنْ عَذَابِ النَّارِ"]}
  teks: "اللَّهُمَّ اغْفِرْ لَهُ وَارْحَمْهُ | وَعَافِهِ وَاعْفُ عَنْهُ | وَأَكْرِمْ نُزُلَهُ | وَوَسِّعْ مُدْخَلَهُ | وَاغْسِلْهُ بِالْمَاءِ وَالثَّلْجِ وَالْبَرَدِ | وَنَقِّهِ مِنَ الْخَطَايَا | كَمَا نَقَّيْتَ الثَّوْبَ الأَبْيَضَ مِنَ الدَّنَسِ | وَأَبْدِلْهُ دَارًا خَيْرًا مِنْ دَارِهِ | وَأَهْلاً خَيْرًا مِنْ أَهْلِهِ | وَزَوْجًا خَيْرًا مِنْ زَوْجِهِ | وَأَدْخِلْهُ الْجَنَّةَ | وَأَعِذْهُ مِنْ عَذَابِ الْقَبْرِ | وَمِنْ عَذَابِ النَّارِ"
  frasa: "Ya Allah, ampunilah dia dan rahmatilah dia | sejahterakanlah dia dan maafkanlah dia | muliakanlah tempat persinggahannya | dan luaskanlah tempat masuknya (kubur) | dan mandikanlah dia dengan air, salji dan air dingin | dan bersihkanlah dia daripada kesalahan | sebagaimana Engkau membersihkan kain putih daripada kotoran | dan gantikanlah baginya rumah yang lebih baik daripada rumahnya | dan keluarga yang lebih baik daripada keluarganya | dan pasangan yang lebih baik daripada pasangannya | dan masukkanlah dia ke dalam syurga | dan lindungilah dia daripada azab kubur | dan daripada azab neraka"
  rumi: "Allaahummaghfir lahuu warhamhu, wa 'aafihii wa'fu 'anh, wa akrim nuzulah, wa wassi' mudkhalah, waghsilhu bil maa'i wats tsalji wal barad, wa naqqihii minal khathaayaa kamaa naqqaitats tsaubal abyadha minad danas, wa abdilhu daaran khairan min daarih, wa ahlan khairan min ahlih, wa zaujan khairan min zaujih, wa adkhilhul jannah, wa a'idzhu min 'adzaabil qabri wa min 'adzaabin naar."
  makna: "Ya Allah, ampunilah, rahmatilah, sejahterakan dan maafkanlah dia; muliakanlah persinggahannya dan luaskanlah kuburnya; mandikanlah dia dengan air, salji dan air dingin, dan bersihkanlah dia daripada kesalahan seperti kain putih dibersihkan daripada kotoran. Gantikanlah baginya rumah, keluarga dan pasangan yang lebih baik, masukkanlah dia ke syurga, dan lindungilah dia daripada azab kubur dan azab neraka."

- id: ziarah-kubur
  tajuk: Ziarah kubur
  kat: [kematian]
  tag: [ziarah kubur, kubur, arwah, hari raya]
  sumber: {jenis: hadis, ruj: "Sahih Muslim, no. 975", darjat: Sahih, url: "https://sunnah.com/muslim:975"}
  teks: "السَّلاَمُ عَلَيْكُمْ أَهْلَ الدِّيَارِ | مِنَ الْمُؤْمِنِينَ وَالْمُسْلِمِينَ | وَإِنَّا إِنْ شَاءَ اللَّهُ لَلاَحِقُونَ | أَسْأَلُ اللَّهَ لَنَا وَلَكُمُ الْعَافِيَةَ"
  frasa: "Salam sejahtera ke atas kamu, wahai penghuni kubur | dari kalangan orang mukmin dan muslim | dan sesungguhnya kami, insya-Allah, akan menyusul kamu | Aku memohon kepada Allah afiat untuk kami dan kamu"
  rumi: "Assalaamu 'alaikum ahlad diyaar, minal mu'miniina wal muslimiin, wa innaa in syaa'allaahu lalaahiquun, as'alullaaha lanaa wa lakumul 'aafiyah."
  makna: "Salam sejahtera ke atas kamu, wahai penghuni kubur dari kalangan mukmin dan muslim; kami insya-Allah akan menyusul kamu. Aku memohon kepada Allah keselamatan untuk kami dan kamu."

- id: jenazah-kanak
  tajuk: Doa untuk jenazah kanak-kanak
  kat: [kematian, keluarga]
  tag: [jenazah, bayi, kanak-kanak, keguguran, ibu bapa]
  sumber: {jenis: ulama, ruj: "Ibn Qudamah, al-Mughni 3/416; Hisn al-Muslim no. 160", darjat: Ulama, url: "https://sunnah.com/hisn:160", nota: "Doa yang dinukil oleh ulama fiqh untuk jenazah kanak-kanak; bukan lafaz hadis marfu'."}
  teks: "اَللّٰهُمَّ اجْعَلْهُ فَرَطًا وَذُخْرًا لِوَالِدَيْهِ | وَشَفِيْعًا مُجَابًا | اَللّٰهُمَّ ثَقِّلْ بِهِ مَوَازِيْنَهُمَا | وَأَعْظِمْ بِهِ أُجُوْرَهُمَا | وَأَلْحِقْهُ بِصَالِحِ الْمُؤْمِنِيْنَ | وَاجْعَلْهُ فِيْ كَفَالَةِ إِبْرَاهِيْمَ | وَقِهِ بِرَحْمَتِكَ عَذَابَ الْجَحِيْمِ"
  frasa: "Ya Allah, jadikanlah dia pendahulu dan simpanan (pahala) bagi kedua ibu bapanya | dan pemberi syafaat yang diperkenankan | Ya Allah, beratkanlah dengannya timbangan (amal) kedua-duanya | dan besarkanlah dengannya pahala kedua-duanya | dan himpunkanlah dia bersama orang-orang mukmin yang soleh | dan jadikanlah dia dalam jagaan (Nabi) Ibrahim | dan peliharalah dia dengan rahmat-Mu daripada azab neraka"
  rumi: "Allaahummaj'alhu farathan wa dzukhran liwaalidaihi wa syafii'an mujaabaa. Allaahumma tsaqqil bihii mawaaziinahumaa, wa a'zim bihii ujuurahumaa, wa alhiqhu bishaalihil mu'miniin, waj'alhu fii kafaalati ibraahiim, wa qihi birahmatika 'adzaabal jahiim."
  makna: "Ya Allah, jadikanlah dia pendahulu dan simpanan pahala bagi ibu bapanya serta pemberi syafaat yang diperkenankan. Beratkanlah timbangan amal dan besarkanlah pahala kedua-duanya kerananya; himpunkanlah dia bersama mukmin yang soleh dalam jagaan Nabi Ibrahim, dan peliharalah dia dengan rahmat-Mu daripada azab neraka."
