# Doa & zikir daripada buku "Surah Yaasiin, Tahlil & Doa" (ISBN 983-046-278-1).
# Teks Arab ditranskripsi daripada imbasan buku dan disemak dengan teks lazim.
# Format: rujuk kandungan/BACA-SAYA.md. Tanda " | " memisahkan frasa (Arab) dan maknanya (BM): bilangan mesti sama.
# Rumi TIDAK diberi untuk petikan ayat al-Quran (Muzakarah Fatwa Kebangsaan ke-24, 1989); petikan ayat ditulis sebagai "- quran: s:a".

- id: istighfar-3
  tajuk: Istighfar (pembuka)
  kat: [tahlil]
  tag: [istighfar, yaasin, pembuka]
  ulang: 3
  sumber: {jenis: buku, ruj: "Buku Yaasiin, ms 2 (Kaifiat, langkah 5)", darjat: amalan}
  teks: "أَسْتَغْفِرُ اللّٰهَ الْعَظِيْمَ"
  frasa: "Aku memohon ampun kepada Allah Yang Maha Agung"
  rumi: "Astaghfirullaahal 'aziim."
  makna: "Aku memohon ampun kepada Allah Yang Maha Agung."

- id: fatihah-hadiah
  tajuk: Fatihah memulakan Yaasin & Tahlil
  subtajuk: Hadiah bacaan kepada roh ibu bapa dan muslimin
  kat: [tahlil]
  tag: [hadiah, fatihah, yaasin, tahlil, arwah, pembuka]
  lihat: [tahlil, fadhilat-yaasin]
  sumber: {jenis: buku, ruj: "Buku Yaasiin, ms 5–6", darjat: ulama}
  nota: "Jika nama arwah diisi, baris \"khususnya kepada roh…\" dimasukkan secara automatik (ms 5). Tanpa nama, ia menjadi versi \"Yaasin sahaja\" (ms 6)."
  bahagian:
    - teks: "اَلْفَاتِحَةَ وَيٰسٓ | إِلَى أَرْوَاحِ وَالِدِيْنَا وَوَالِدِيْكُمْ | وَإِلَى أَرْوَاحِ الْمُسْلِمِيْنَ وَالْمُسْلِمَاتِ | كَافَّةً عَامَّةً"
      frasa: "(Kami hadiahkan) al-Fatihah dan Yaasin | kepada roh ibu bapa kami dan ibu bapa kamu | dan kepada roh sekalian muslimin dan muslimat | seluruhnya secara umum"
      rumi: "Al-Faatihata wa Yaasiin, ilaa arwaahi waalidiinaa wa waalidiikum, wa ilaa arwaahil muslimiina wal muslimaati kaaffatan 'aammah."
      makna: "(Kami hadiahkan bacaan) al-Fatihah dan Yaasin kepada roh ibu bapa kami dan ibu bapa kamu, dan kepada roh sekalian muslimin dan muslimat seluruhnya."
    - arwah: khusus-fatihah
    - teks: "وَإِلَى حَضْرَةِ النَّبِيِّ الْمُصْطَفَى | رَسُوْلِ اللّٰهِ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ | وَآلِهِ وَأَصْحَابِهِ الْكِرَامِ | اَلْفَاتِحَةْ"
      frasa: "Dan kepada hadrat Nabi yang terpilih | Rasulullah, semoga Allah melimpahkan selawat dan salam ke atasnya | serta keluarga dan para sahabatnya yang mulia | al-Fatihah"
      rumi: "Wa ilaa hadhratin nabiyyil mustafaa, rasuulillaahi sallallaahu 'alaihi wa sallam, wa aalihii wa ash-haabihil kiraam. Al-Faatihah."
      makna: "Dan kepada hadrat Nabi yang terpilih, Rasulullah ﷺ, serta keluarga dan para sahabat baginda yang mulia. Al-Fatihah."

- id: selawat-11
  tajuk: Selawat sebelum Yaasin
  kat: [tahlil, selawat]
  tag: [selawat, yaasin]
  ulang: 11
  sumber: {jenis: buku, ruj: "Buku Yaasiin, ms 7", darjat: amalan}
  teks: "اَللّٰهُمَّ صَلِّ | عَلَى سَيِّدِنَا مُحَمَّدٍ | وَعَلَى آلِهِ وَصَحْبِهِ | وَسَلِّمْ"
  frasa: "Ya Allah, limpahkanlah selawat | ke atas penghulu kami Muhammad | dan ke atas keluarga serta sahabatnya | dan kurniakanlah kesejahteraan"
  rumi: "Allaahumma salli 'alaa sayyidinaa Muhammadin wa 'alaa aalihii wa sahbihii wa sallim."
  makna: "Ya Allah, limpahkanlah selawat ke atas penghulu kami Muhammad, serta keluarga dan sahabat baginda, dan kurniakanlah kesejahteraan."

- id: doa-selepas-yaasin
  tajuk: Doa Selepas Membaca Yaasin
  kat: [tahlil]
  tag: [yaasin, doa yaasin, hajat, kesusahan, hutang]
  lihat: [fadhilat-yaasin]
  sumber: {jenis: buku, ruj: "Buku Yaasiin, ms 30–32", darjat: ulama, nota: "Doa susunan ulama yang lazim dibaca di Nusantara selepas Yaasin; bukan lafaz hadis. Mengandungi tawassul (\"bi haqqi\"), amalan yang diterima dalam mazhab Syafi'i arus perdana."}
  bahagian:
    - tajuk: Pujian dan selawat
      teks: "بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ | اَلْحَمْدُ لِلّٰهِ رَبِّ الْعَالَمِيْنَ | حَمْدًا يُوَافِيْ نِعَمَهُ | وَيُكَافِئُ مَزِيْدَهُ | يَا رَبَّنَا لَكَ الْحَمْدُ | كَمَا يَنْبَغِيْ لِجَلَالِ وَجْهِكَ | وَعَظِيْمِ سُلْطَانِكَ | اَللّٰهُمَّ صَلِّ وَسَلِّمْ | عَلَى سَيِّدِنَا مُحَمَّدٍ | وَعَلَى آلِهِ وَصَحْبِهِ أَجْمَعِيْنَ"
      frasa: "Dengan nama Allah Yang Maha Pemurah lagi Maha Mengasihani | Segala puji bagi Allah, Tuhan sekalian alam | pujian yang menyamai nikmat-nikmat-Nya | dan membalas tambahan kurniaan-Nya | Wahai Tuhan kami, bagi-Mu segala puji | sebagaimana yang layak bagi keagungan wajah-Mu | dan kebesaran kekuasaan-Mu | Ya Allah, limpahkanlah selawat dan salam | ke atas penghulu kami Muhammad | dan ke atas keluarga serta sahabatnya sekalian"
      rumi: "Bismillaahir rahmaanir rahiim. Alhamdu lillaahi rabbil 'aalamiin, hamdan yuwaafii ni'amahuu wa yukaafi'u maziidah. Yaa rabbanaa lakal hamdu kamaa yanbaghii lijalaali wajhika wa 'aziimi sultaanik. Allaahumma salli wa sallim 'alaa sayyidinaa Muhammadin wa 'alaa aalihii wa sahbihii ajma'iin."
      makna: "Dengan nama Allah Yang Maha Pemurah lagi Maha Mengasihani. Segala puji bagi Allah, Tuhan sekalian alam, pujian yang menyamai nikmat-nikmat-Nya dan membalas tambahan kurniaan-Nya. Wahai Tuhan kami, bagi-Mu segala puji sebagaimana yang layak bagi keagungan wajah-Mu dan kebesaran kekuasaan-Mu. Ya Allah, limpahkanlah selawat dan salam ke atas penghulu kami Muhammad serta keluarga dan sahabat baginda sekalian."
    - tajuk: Tawassul
      teks: "اَللّٰهُمَّ بِحَقِّ يٰسٓ وَالْقُرْآنِ الْحَكِيْمِ | وَبِمَنِ اخْتَرْتَهُ بِالرِّسَالَةِ وَالنُّبُوَّةِ | وَالْوِلَايَةِ وَالْهِدَايَةِ إِلَى صِرَاطِكَ الْمُسْتَقِيْمِ | وَبِجَمِيْعِ مَا جَاءَ بِهِ مِنْكَ جِبْرِيْلُ | تَنْزِيْلَ الْعَزِيْزِ الرَّحِيْمِ | وَبِخَوَاصِّ الْحُرُوْفِ وَالْأَسْمَاءِ التَّامَّاتِ | وَبِمَا أَظْهَرْتَ فِي الْوُجُوْدِ لِكُلِّ مَوْجُوْدٍ | مِنَ الْآيَاتِ الْبَيِّنَاتِ | وَبِخَفِيِّ لُطْفِكَ الْمُفَرِّجِ عَنْ كُلِّ مَهْمُوْمٍ | الْمُخَلِّصِ لِكُلِّ مَدْيُوْنٍ | يَا مُجْرِيَ الْبِحَارِ وَالْعُيُوْنِ | يَا مَنْ خَزَائِنُهُ بَيْنَ الْكَافِ وَالنُّوْنِ | وَعَلِمَ بِمَا كَانَ قَبْلَ أَنْ يَكُوْنَ"
      frasa: "Ya Allah, dengan kemuliaan Yaasin dan al-Quran yang penuh hikmah | dan dengan (kemuliaan) insan yang Engkau pilih dengan risalah dan kenabian | dan kewalian serta hidayah ke jalan-Mu yang lurus | dan dengan segala yang dibawa oleh Jibril daripada-Mu | (iaitu) wahyu daripada Yang Maha Perkasa lagi Maha Mengasihani | dan dengan keistimewaan huruf-huruf dan nama-nama-Mu yang sempurna | dan dengan apa yang Engkau zahirkan dalam kewujudan bagi setiap yang wujud | daripada tanda-tanda yang nyata | dan dengan kelembutan-Mu yang tersembunyi, yang melapangkan setiap yang runsing | yang melepaskan setiap orang yang berhutang | Wahai Tuhan yang mengalirkan lautan dan mata air | Wahai Tuhan yang perbendaharaan-Nya antara kaf dan nun (\"Kun\") | dan mengetahui apa yang ada sebelum ia berlaku"
      rumi: "Allaahumma bihaqqi ⟨36:1-2⟩, wa biman ikhtartahuu birrisaalati wan nubuwwati wal wilaayati wal hidaayati ilaa siraatikal mustaqiim, wa bijamii'i maa jaa'a bihii minka jibriilu ⟨36:5⟩, wa bikhawaassil huruufi wal asmaa'it taammaat, wa bimaa azhartaa fil wujuudi likulli maujuudin minal aayaatil bayyinaat, wa bikhafiyyi lutfikal mufarriji 'an kulli mahmuum, al-mukhallisi likulli madyuun. Yaa mujriyal bihaari wal 'uyuun, yaa man khazaa'inuhuu bainal kaafi wan nuun, wa 'alima bimaa kaana qabla an yakuun."
      makna: "Ya Allah, dengan kemuliaan Yaasin dan al-Quran yang penuh hikmah, dan dengan insan yang Engkau pilih dengan risalah, kenabian, kewalian dan hidayah ke jalan-Mu yang lurus, dan dengan segala yang dibawa oleh Jibril daripada-Mu, wahyu daripada Yang Maha Perkasa lagi Maha Mengasihani; dengan keistimewaan huruf-huruf dan nama-nama-Mu yang sempurna; dengan tanda-tanda nyata yang Engkau zahirkan bagi setiap yang wujud; dan dengan kelembutan-Mu yang tersembunyi yang melapangkan setiap yang runsing dan melepaskan setiap yang berhutang. Wahai Tuhan yang mengalirkan lautan dan mata air, wahai Tuhan yang perbendaharaan-Nya antara kaf dan nun, yang mengetahui sesuatu sebelum ia berlaku."
    - tajuk: Permohonan
      teks: "وَنَسْأَلُكَ اللّٰهُمَّ أَنْ تَسْلُكَ بِنَا جَادَّةَ رِضَاكَ | وَأَنْ تَجْعَلَنَا أَهْلًا وَمَحَلًّا لِسَعَادَتِكَ وَغِنَاكَ | وَأَنْ تُيَسِّرَ لَنَا جَمِيْعَ الْمُرَادَاتِ وَالْمَطَالِبِ | وَأَنْ تَجْعَلَ رِضَاكَ عَنَّا خَيْرَ مُصَاحِبٍ لَنَا وَرَفِيْقٍ | وَأَنْ تُتْحِفَنَا بِالْجَلَالَةِ وَالْمَهَابَةِ | وَأَنْ تَمُنَّ عَلَيْنَا بِسُرْعَةِ الْإِجَابَةِ | اِسْتَجِبِ اللّٰهُمَّ دُعَاءَنَا | وَحَقِّقْ فِيْكَ رَجَاءَنَا | وَأَدْخِلْنَا فِيْ حِرْزِ لُطْفِكَ الْمَصُوْنِ | بِسِرِّ قَوْلِكَ"
      frasa: "Dan kami memohon kepada-Mu, ya Allah, agar Engkau bawa kami menyusuri jalan keredaan-Mu | dan agar Engkau jadikan kami ahli dan tempat bagi kebahagiaan dan kekayaan kurniaan-Mu | dan agar Engkau mudahkan bagi kami segala hajat dan permintaan | dan agar Engkau jadikan keredaan-Mu terhadap kami sebaik-baik teman dan sahabat kami | dan agar Engkau hadiahkan kami kemuliaan dan kewibawaan | dan agar Engkau kurniakan doa kami dimakbulkan dengan segera | Perkenankanlah, ya Allah, doa kami | dan tunaikanlah harapan kami kepada-Mu | dan masukkanlah kami ke dalam benteng kelembutan-Mu yang terpelihara | dengan rahsia firman-Mu"
      rumi: "Wa nas'alukallaahumma an tasluka binaa jaaddata ridhaak, wa an taj'alanaa ahlan wa mahallan lisa'aadatika wa ghinaak, wa an tuyassira lanaa jamii'al muraadaati wal mataalib, wa an taj'ala ridhaaka 'annaa khaira musaahibin lanaa wa rafiiq, wa an tutfanaa bil jalaalati wal mahaabah, wa an tamunna 'alainaa bisur'atil ijaabah. Istajibillaahumma du'aa'anaa, wa haqqiq fiika rajaa'anaa, wa adkhilnaa fii hirzi lutfikal masuun, bisirri qaulik:"
      makna: "Kami memohon kepada-Mu, ya Allah, agar Engkau bawa kami menyusuri jalan keredaan-Mu, jadikan kami layak menerima kebahagiaan dan kekayaan kurniaan-Mu, mudahkan segala hajat dan permintaan kami, jadikan keredaan-Mu sebaik-baik teman kami, kurniakan kami kemuliaan dan kewibawaan, dan makbulkan doa kami dengan segera. Perkenankanlah, ya Allah, doa kami, tunaikanlah harapan kami kepada-Mu, dan masukkanlah kami ke dalam benteng kelembutan-Mu yang terpelihara, dengan rahsia firman-Mu:"
    - quran: "36:82-83"
    - tajuk: Penutup
      teks: "سُبْحَانَ الْمُنَفِّسِ عَنْ كُلِّ مَهْمُوْمٍ | سُبْحَانَ الْمُنَفِّسِ عَنْ كُلِّ مَغْمُوْمٍ | سُبْحَانَ الْمُنَفِّسِ عَنْ كُلِّ مَدْيُوْنٍ | سُبْحَانَ مَنْ أَمْرُهُ إِذَا أَرَادَ شَيْئًا أَنْ يَقُوْلَ لَهُ كُنْ فَيَكُوْنُ | يَا مُفَرِّجَ الْهُمُوْمِ | يَا مُفَرِّجُ فَرِّجْ، يَا مُفَرِّجُ فَرِّجْ | فَرِّجْ عَنَّا هُمُوْمَنَا | يَا حَيُّ يَا قَيُّوْمُ | يَا ذَا الْجَلَالِ وَالْإِكْرَامِ | وَصَلَّى اللّٰهُ عَلَى سَيِّدِنَا مُحَمَّدٍ | وَعَلَى آلِهِ وَصَحْبِهِ وَسَلَّمَ | وَالْحَمْدُ لِلّٰهِ رَبِّ الْعَالَمِيْنَ"
      frasa: "Maha Suci (Allah) yang melapangkan setiap yang runsing | Maha Suci (Allah) yang melapangkan setiap yang berduka | Maha Suci (Allah) yang melapangkan setiap yang berhutang | Maha Suci (Allah) yang urusan-Nya, apabila Dia menghendaki sesuatu, Dia hanya berfirman \"Jadilah\", maka jadilah ia | Wahai Tuhan yang melapangkan segala kerunsingan | Wahai Yang Melapangkan, lapangkanlah (2 kali) | lapangkanlah kerunsingan kami | Wahai Yang Maha Hidup, wahai Yang Maha Berdiri Sendiri | Wahai Tuhan yang memiliki keagungan dan kemuliaan | Dan semoga Allah melimpahkan selawat ke atas penghulu kami Muhammad | serta keluarga dan sahabatnya, dan kesejahteraan | Dan segala puji bagi Allah, Tuhan sekalian alam"
      rumi: "Subhaanal munaffisi 'an kulli mahmuum, subhaanal munaffisi 'an kulli maghmuum, subhaanal munaffisi 'an kulli madyuun, subhaana man ⟨36:82⟩. Yaa mufarrijal humuum, yaa mufarriju farrij, yaa mufarriju farrij, farrij 'annaa humuumanaa, yaa hayyu yaa qayyuum, yaa dzal jalaali wal ikraam. Wa sallallaahu 'alaa sayyidinaa Muhammadin wa 'alaa aalihii wa sahbihii wa sallam, walhamdu lillaahi rabbil 'aalamiin."
      makna: "Maha Suci Allah yang melapangkan setiap yang runsing, yang berduka dan yang berhutang; Maha Suci Dia yang apabila menghendaki sesuatu, Dia hanya berfirman \"Jadilah!\" maka jadilah ia. Wahai Tuhan yang melapangkan segala kerunsingan, lapangkanlah kerunsingan kami, wahai Yang Maha Hidup lagi Maha Berdiri Sendiri, wahai Tuhan yang memiliki keagungan dan kemuliaan. Selawat dan salam ke atas penghulu kami Muhammad, keluarga dan sahabat baginda; segala puji bagi Allah, Tuhan sekalian alam."

- id: doa-nisfu-syaaban
  tajuk: Doa Yaasin Malam Nisfu Syaaban
  kat: [tahlil, musim]
  tag: [nisfu syaaban, syaaban, yaasin, rezeki, umur]
  lihat: [nisfu-syaaban]
  bila: "Malam 15 Syaaban, selepas setiap kali bacaan Yaasin (buku: selepas Maghrib)"
  sumber: {jenis: buku, ruj: "Buku Yaasiin, ms 33–34", darjat: ulama, nota: "Lafaz doa ini berasal daripada kata-kata sahabat dan salaf, bukan hadis Nabi ﷺ; perenggan penutup (\"Ilaahii bit tajalliyil a'zam…\") ialah tambahan Syeikh Ma' al-'Ainain al-Syanqiti (Dar al-Ifta' Mesir, Fatwa 3009). Bacaan Yaasin 3 kali tiada nas khusus; boleh diamalkan sebagai doa umum tanpa menganggapnya sunnah warid."}
  nota: "Ayat {{44:3-4}} (\"dibezakan setiap urusan yang penuh hikmah\") merujuk kepada malam al-Qadar dalam Ramadan menurut Ibn Kathir dan jumhur mufassirin; pandangan yang mengaitkannya dengan Nisfu Syaaban (diriwayatkan daripada 'Ikrimah) ditolak oleh Ibn Kathir. [[nisfu-syaaban|Baca nota hukum]]"
  bahagian:
    - tajuk: Pembuka
      teks: "بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ | اَلْحَمْدُ لِلّٰهِ رَبِّ الْعَالَمِيْنَ | وَالصَّلَاةُ وَالسَّلَامُ عَلَى سَيِّدِنَا مُحَمَّدٍ أَشْرَفِ الْمُرْسَلِيْنَ | وَعَلَى آلِهِ وَصَحْبِهِ أَجْمَعِيْنَ"
      frasa: "Dengan nama Allah Yang Maha Pemurah lagi Maha Mengasihani | Segala puji bagi Allah, Tuhan sekalian alam | Selawat dan salam ke atas penghulu kami Muhammad, semulia-mulia para rasul | dan ke atas keluarga serta sahabatnya sekalian"
      rumi: "Bismillaahir rahmaanir rahiim. Alhamdu lillaahi rabbil 'aalamiin, wassalaatu wassalaamu 'alaa sayyidinaa Muhammadin asyrafil mursaliin, wa 'alaa aalihii wa sahbihii ajma'iin."
      makna: "Dengan nama Allah Yang Maha Pemurah lagi Maha Mengasihani. Segala puji bagi Allah, Tuhan sekalian alam. Selawat dan salam ke atas penghulu kami Muhammad, semulia-mulia rasul, serta keluarga dan sahabat baginda sekalian."
    - tajuk: Doa
      teks: "اَللّٰهُمَّ يَا ذَا الْمَنِّ وَلَا يُمَنُّ عَلَيْهِ | يَا ذَا الْجَلَالِ وَالْإِكْرَامِ | يَا ذَا الطَّوْلِ وَالْإِنْعَامِ | لَا إِلٰهَ إِلَّا أَنْتَ | ظَهْرَ اللَّاجِيْنَ | وَجَارَ الْمُسْتَجِيْرِيْنَ | وَأَمَانَ الْخَائِفِيْنَ | اَللّٰهُمَّ إِنْ كُنْتَ كَتَبْتَنِيْ عِنْدَكَ فِيْ أُمِّ الْكِتَابِ | شَقِيًّا أَوْ مَحْرُوْمًا | أَوْ مَطْرُوْدًا أَوْ مُقَتَّرًا عَلَيَّ فِي الرِّزْقِ | فَامْحُ اللّٰهُمَّ بِفَضْلِكَ | شَقَاوَتِيْ وَحِرْمَانِيْ | وَطَرْدِيْ وَاقْتِتَارَ رِزْقِيْ | وَأَثْبِتْنِيْ عِنْدَكَ فِيْ أُمِّ الْكِتَابِ | سَعِيْدًا مَرْزُوْقًا | مُوَفَّقًا لِلْخَيْرَاتِ | فَإِنَّكَ قُلْتَ وَقَوْلُكَ الْحَقُّ | فِيْ كِتَابِكَ الْمُنْزَلِ | عَلَى لِسَانِ نَبِيِّكَ الْمُرْسَلِ"
      frasa: "Ya Allah, wahai Tuhan yang sentiasa memberi kurnia dan tidak menerima kurnia | Wahai Tuhan yang memiliki keagungan dan kemuliaan | Wahai Tuhan yang memiliki keluasan pemberian dan nikmat | Tiada tuhan melainkan Engkau | (Engkaulah) tempat bersandar orang yang memohon perlindungan | dan pelindung orang yang meminta perlindungan | dan tempat aman orang yang ketakutan | Ya Allah, jika Engkau telah menulis aku di sisi-Mu dalam Ummul Kitab | sebagai orang yang celaka atau terhalang (daripada kebaikan) | atau tersisih, atau disempitkan rezekiku | maka hapuskanlah, ya Allah, dengan kurnia-Mu | kecelakaanku dan keterhalanganku | dan ketersisihanku serta kesempitan rezekiku | dan tetapkanlah aku di sisi-Mu dalam Ummul Kitab | sebagai orang yang bahagia, dimurahkan rezeki | dan diberi taufik kepada segala kebaikan | Kerana sesungguhnya Engkau telah berfirman, dan firman-Mu adalah benar | dalam kitab-Mu yang diturunkan | melalui lisan Nabi-Mu yang diutus"
      rumi: "Allaahumma yaa dzal manni wa laa yumannu 'alaih, yaa dzal jalaali wal ikraam, yaa dzat tauli wal in'aam, laa ilaaha illaa anta zahral laajiin, wa jaaral mustajiiriin, wa amaanal khaa'ifiin. Allaahumma in kunta katabtanii 'indaka fii ummil kitaabi syaqiyyan au mahruuman au matruudan au muqattaran 'alayya fir rizqi, famhullaahumma bifadhlika syaqaawatii wa hirmaanii wa tardii waqtitaara rizqii, wa atsbitnii 'indaka fii ummil kitaabi sa'iidan marzuuqan muwaffaqan lil khairaat, fa innaka qulta wa qaulukal haqqu fii kitaabikal munzali 'alaa lisaani nabiyyikal mursal:"
      makna: "Ya Allah, wahai Tuhan yang sentiasa memberi kurnia namun tidak menerima kurnia, yang memiliki keagungan, kemuliaan, keluasan pemberian dan nikmat; tiada tuhan melainkan Engkau, tempat bersandar orang yang memohon perlindungan, pelindung yang diminta perlindungan, dan tempat aman orang yang ketakutan. Ya Allah, jika Engkau telah menulis aku di sisi-Mu dalam Ummul Kitab sebagai orang yang celaka, terhalang, tersisih atau sempit rezeki, maka hapuskanlah semua itu dengan kurnia-Mu, dan tetapkanlah aku di sisi-Mu sebagai orang yang bahagia, dimurahkan rezeki dan diberi taufik kepada kebaikan. Kerana Engkau telah berfirman, dan firman-Mu benar, dalam kitab-Mu yang diturunkan kepada Nabi-Mu:"
    - quran: "13:39"
    - tajuk: Penutup (tambahan Syeikh Ma' al-'Ainain)
      teks: "إِلٰهِيْ بِالتَّجَلِّي الْأَعْظَمِ | فِيْ لَيْلَةِ النِّصْفِ مِنْ شَهْرِ شَعْبَانَ الْمُكَرَّمِ | الَّتِيْ يُفْرَقُ فِيْهَا كُلُّ أَمْرٍ حَكِيْمٍ وَيُبْرَمُ | أَنْ تَكْشِفَ عَنَّا مِنَ الْبَلَاءِ | مَا نَعْلَمُ وَمَا لَا نَعْلَمُ | وَمَا أَنْتَ بِهِ أَعْلَمُ | إِنَّكَ أَنْتَ الْأَعَزُّ الْأَكْرَمُ | وَصَلَّى اللّٰهُ عَلَى سَيِّدِنَا مُحَمَّدٍ | وَعَلَى آلِهِ وَصَحْبِهِ وَسَلَّمَ | وَالْحَمْدُ لِلّٰهِ رَبِّ الْعَالَمِيْنَ"
      frasa: "Wahai Tuhanku, dengan tajalli-Mu yang teragung | pada malam pertengahan bulan Syaaban yang dimuliakan | yang padanya dipisahkan dan diputuskan setiap urusan yang penuh hikmah | (kami memohon) agar Engkau hindarkan daripada kami bala | yang kami ketahui dan yang tidak kami ketahui | dan yang Engkau lebih mengetahuinya | Sesungguhnya Engkau Maha Perkasa lagi Maha Pemurah | Semoga Allah melimpahkan selawat ke atas penghulu kami Muhammad | serta keluarga dan sahabatnya, dan kesejahteraan | Dan segala puji bagi Allah, Tuhan sekalian alam"
      rumi: "Ilaahii bit tajalliyil a'zami fii lailatin nisfi min syahri sya'baanal mukarram, allatii ⟨44:4⟩ wa yubram, an taksyifa 'annaa minal balaa'i maa na'lamu wa maa laa na'lamu wa maa anta bihii a'lam, innaka antal a'azzul akram. Wa sallallaahu 'alaa sayyidinaa Muhammadin wa 'alaa aalihii wa sahbihii wa sallam, walhamdu lillaahi rabbil 'aalamiin."
      makna: "Wahai Tuhanku, dengan tajalli-Mu yang teragung pada malam pertengahan Syaaban yang dimuliakan, kami memohon agar Engkau hindarkan daripada kami bala yang kami ketahui, yang tidak kami ketahui dan yang Engkau lebih mengetahuinya. Sesungguhnya Engkau Maha Perkasa lagi Maha Pemurah. Selawat dan salam ke atas penghulu kami Muhammad, keluarga dan sahabat baginda; segala puji bagi Allah, Tuhan sekalian alam."

- id: tahlil-pembuka
  tajuk: Hadiah Fatihah pembuka Tahlil
  kat: [tahlil]
  tag: [tahlil, hadiah, arwah, pembuka]
  lihat: [tahlil]
  sumber: {jenis: buku, ruj: "Buku Yaasiin, ms 35", darjat: ulama}
  bahagian:
    - teks: "إِلَى حَضْرَةِ سَيِّدِنَا وَحَبِيْبِنَا وَشَفِيْعِنَا مُحَمَّدٍ | صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ | وَإِلَى أَرْوَاحِ آبَائِهِ وَإِخْوَانِهِ مِنَ الْأَنْبِيَاءِ وَالْمُرْسَلِيْنَ | صَلَوَاتُ اللّٰهِ وَسَلَامُهُ عَلَيْهِ وَعَلَيْهِمْ أَجْمَعِيْنَ | وَعَلَى آلِ كُلٍّ وَالصَّحَابَةِ وَالْقَرَابَةِ وَالتَّابِعِيْنَ | وَتَابِعِ التَّابِعِيْنَ بِإِحْسَانٍ إِلَى يَوْمِ الدِّيْنِ | وَإِلَى أَرْوَاحِ وَالِدِيْنَا وَمُعَلِّمِيْنَا | وَذَوِي الْحُقُوْقِ عَلَيْنَا أَجْمَعِيْنَ"
      frasa: "Kepada hadrat penghulu kami, kekasih kami dan pemberi syafaat kami, Muhammad | semoga Allah melimpahkan selawat dan salam ke atasnya | dan kepada roh bapa-bapa dan saudara-saudaranya dari kalangan para nabi dan rasul | selawat dan salam Allah ke atas baginda dan ke atas mereka sekalian | dan ke atas keluarga setiap mereka, para sahabat, kaum kerabat dan tabi'in | dan pengikut tabi'in dengan kebaikan hingga hari pembalasan | dan kepada roh ibu bapa kami dan guru-guru kami | dan orang-orang yang mempunyai hak ke atas kami sekalian"
      rumi: "Ilaa hadhrati sayyidinaa wa habiibinaa wa syafii'inaa Muhammadin sallallaahu 'alaihi wa sallam, wa ilaa arwaahi aabaa'ihii wa ikhwaanihii minal anbiyaa'i wal mursaliin, salawaatullaahi wa salaamuhuu 'alaihi wa 'alaihim ajma'iin, wa 'alaa aali kullin was sahaabati wal qaraabati wat taabi'iin, wa taabi'it taabi'iina bi ihsaanin ilaa yaumid diin, wa ilaa arwaahi waalidiinaa wa mu'allimiinaa wa dzawil huquuqi 'alainaa ajma'iin."
      makna: "Kepada hadrat penghulu, kekasih dan pemberi syafaat kami, Muhammad ﷺ, dan kepada roh bapa-bapa dan saudara-saudara baginda dari kalangan para nabi dan rasul — selawat dan salam Allah ke atas baginda dan mereka sekalian — serta keluarga mereka, para sahabat, kaum kerabat, tabi'in dan pengikut tabi'in hingga hari kiamat; dan kepada roh ibu bapa kami, guru-guru kami dan sesiapa yang mempunyai hak ke atas kami sekalian."
    - arwah: khusus-fatihah
      pilihan: true
    - teks: "اَلْفَاتِحَةْ"
      frasa: "al-Fatihah"
      rumi: "Al-Faatihah."
      makna: "(Bacalah) al-Fatihah."

- id: zikir-tahlil-takbir
  tajuk: Tahlil dan takbir
  kat: [tahlil, zikir]
  tag: [tahlil, takbir]
  sumber: {jenis: buku, ruj: "Buku Yaasiin, ms 37–38 (selepas al-Ikhlas, al-Falaq, an-Nas)", darjat: amalan}
  teks: "لَا إِلٰهَ إِلَّا اللّٰهُ | وَاللّٰهُ أَكْبَرُ"
  frasa: "Tiada tuhan (yang disembah) melainkan Allah | dan Allah Maha Besar"
  rumi: "Laa ilaaha illallaahu wallaahu akbar."
  makna: "Tiada tuhan yang disembah melainkan Allah, dan Allah Maha Besar."

- id: zikir-irhamna
  tajuk: Memohon rahmat
  kat: [tahlil, zikir]
  tag: [tahlil, rahmat]
  sumber: {jenis: buku, ruj: "Buku Yaasiin, ms 42", darjat: amalan}
  teks: "بِرَحْمَتِكَ يَا أَرْحَمَ الرَّاحِمِيْنَ ارْحَمْنَا | يَا أَرْحَمَ الرَّاحِمِيْنَ ارْحَمْنَا | يَا أَرْحَمَ الرَّاحِمِيْنَ ارْحَمْنَا"
  frasa: "Dengan rahmat-Mu, wahai Yang Paling Mengasihani, rahmatilah kami | Wahai Yang Paling Mengasihani, rahmatilah kami | Wahai Yang Paling Mengasihani, rahmatilah kami"
  rumi: "Birahmatika yaa arhamar raahimiinarhamnaa, yaa arhamar raahimiinarhamnaa, yaa arhamar raahimiinarhamnaa."
  makna: "Dengan rahmat-Mu, wahai Tuhan Yang Paling Mengasihani di antara yang mengasihani, rahmatilah kami (3 kali)."

- id: selawat-tahlil
  tajuk: Selawat Tahlil (tiga rangkap)
  kat: [tahlil, selawat]
  tag: [selawat, tahlil]
  sumber: {jenis: buku, ruj: "Buku Yaasiin, ms 43–44", darjat: ulama}
  bahagian:
    - teks: "اَللّٰهُمَّ صَلِّ أَفْضَلَ صَلَاةٍ | عَلَى أَسْعَدِ مَخْلُوْقَاتِكَ حَبِيْبِ اللّٰهِ | سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ | عَدَدَ مَعْلُوْمَاتِكَ وَمِدَادَ كَلِمَاتِكَ | كُلَّمَا ذَكَرَكَ الذَّاكِرُوْنَ | وَغَفَلَ عَنْ ذِكْرِكَ الْغَافِلُوْنَ"
      frasa: "Ya Allah, limpahkanlah selawat yang paling utama | ke atas makhluk-Mu yang paling bahagia, kekasih Allah | penghulu kami Muhammad, serta keluarga dan sahabatnya, dan kurniakanlah kesejahteraan | sebanyak bilangan yang Engkau ketahui dan sebanyak dakwat kalimah-kalimah-Mu | setiap kali orang-orang yang berzikir mengingati-Mu | dan setiap kali orang-orang yang lalai lupa daripada mengingati-Mu"
      rumi: "Allaahumma salli afdhala salaatin 'alaa as'adi makhluuqaatika habiibillaah, sayyidinaa Muhammadin wa 'alaa aalihii wa sahbihii wa sallim, 'adada ma'luumaatika wa midaada kalimaatik, kullamaa dzakarakadz dzaakiruun, wa ghafala 'an dzikrikal ghaafiluun."
      makna: "Ya Allah, limpahkanlah selawat yang paling utama ke atas makhluk-Mu yang paling bahagia, kekasih Allah, penghulu kami Muhammad, serta keluarga dan sahabat baginda, dan kurniakanlah kesejahteraan — sebanyak segala yang Engkau ketahui dan sebanyak dakwat kalimah-Mu, setiap kali Engkau diingati oleh orang yang berzikir dan dilupakan oleh orang yang lalai."
    - teks: "اَللّٰهُمَّ صَلِّ أَفْضَلَ صَلَاةٍ | عَلَى أَسْعَدِ مَخْلُوْقَاتِكَ شَمْسِ الضُّحَى | سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ | عَدَدَ مَعْلُوْمَاتِكَ وَمِدَادَ كَلِمَاتِكَ | كُلَّمَا ذَكَرَكَ الذَّاكِرُوْنَ | وَغَفَلَ عَنْ ذِكْرِكَ الْغَافِلُوْنَ"
      frasa: "Ya Allah, limpahkanlah selawat yang paling utama | ke atas makhluk-Mu yang paling bahagia, matahari waktu dhuha | penghulu kami Muhammad, serta keluarga dan sahabatnya, dan kurniakanlah kesejahteraan | sebanyak bilangan yang Engkau ketahui dan sebanyak dakwat kalimah-kalimah-Mu | setiap kali orang-orang yang berzikir mengingati-Mu | dan setiap kali orang-orang yang lalai lupa daripada mengingati-Mu"
      rumi: "Allaahumma salli afdhala salaatin 'alaa as'adi makhluuqaatika syamsidh dhuhaa, sayyidinaa Muhammadin wa 'alaa aalihii wa sahbihii wa sallim, 'adada ma'luumaatika wa midaada kalimaatik, kullamaa dzakarakadz dzaakiruun, wa ghafala 'an dzikrikal ghaafiluun."
      makna: "Ya Allah, limpahkanlah selawat yang paling utama ke atas makhluk-Mu yang paling bahagia, matahari waktu dhuha, penghulu kami Muhammad, serta keluarga dan sahabat baginda, dan kurniakanlah kesejahteraan — sebanyak segala yang Engkau ketahui dan sebanyak dakwat kalimah-Mu, setiap kali Engkau diingati oleh orang yang berzikir dan dilupakan oleh orang yang lalai."
    - teks: "اَللّٰهُمَّ صَلِّ أَفْضَلَ صَلَاةٍ | عَلَى أَسْعَدِ مَخْلُوْقَاتِكَ بَدْرِ الدُّجَى | سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ | عَدَدَ مَعْلُوْمَاتِكَ وَمِدَادَ كَلِمَاتِكَ | كُلَّمَا ذَكَرَكَ الذَّاكِرُوْنَ | وَغَفَلَ عَنْ ذِكْرِكَ الْغَافِلُوْنَ"
      frasa: "Ya Allah, limpahkanlah selawat yang paling utama | ke atas makhluk-Mu yang paling bahagia, bulan purnama di kegelapan malam | penghulu kami Muhammad, serta keluarga dan sahabatnya, dan kurniakanlah kesejahteraan | sebanyak bilangan yang Engkau ketahui dan sebanyak dakwat kalimah-kalimah-Mu | setiap kali orang-orang yang berzikir mengingati-Mu | dan setiap kali orang-orang yang lalai lupa daripada mengingati-Mu"
      rumi: "Allaahumma salli afdhala salaatin 'alaa as'adi makhluuqaatika badrid dujaa, sayyidinaa Muhammadin wa 'alaa aalihii wa sahbihii wa sallim, 'adada ma'luumaatika wa midaada kalimaatik, kullamaa dzakarakadz dzaakiruun, wa ghafala 'an dzikrikal ghaafiluun."
      makna: "Ya Allah, limpahkanlah selawat yang paling utama ke atas makhluk-Mu yang paling bahagia, bulan purnama di kegelapan malam, penghulu kami Muhammad, serta keluarga dan sahabat baginda, dan kurniakanlah kesejahteraan — sebanyak segala yang Engkau ketahui dan sebanyak dakwat kalimah-Mu, setiap kali Engkau diingati oleh orang yang berzikir dan dilupakan oleh orang yang lalai."
    - teks: "وَسَلِّمْ | وَرَضِيَ اللّٰهُ تَبَارَكَ وَتَعَالَى | عَنْ سَادَاتِنَا أَصْحَابِ رَسُوْلِ اللّٰهِ أَجْمَعِيْنَ"
      frasa: "Dan kurniakanlah kesejahteraan | Dan semoga Allah Yang Maha Berkat lagi Maha Tinggi meredai | para pemimpin kami, sahabat-sahabat Rasulullah sekalian"
      rumi: "Wa sallim, wa radhiyallaahu tabaaraka wa ta'aalaa 'an saadaatinaa ash-haabi rasuulillaahi ajma'iin."
      makna: "Dan kurniakanlah kesejahteraan; semoga Allah Yang Maha Berkat lagi Maha Tinggi meredai para sahabat Rasulullah sekalian."

- id: zikir-hasbunallah
  tajuk: Hasbunallah dan hauqalah
  kat: [tahlil, zikir]
  tag: [tawakal, hasbunallah, tahlil]
  sumber: {jenis: buku, ruj: "Buku Yaasiin, ms 44; lafaz hasbunallah daripada {{3:173}}", darjat: amalan}
  teks: "وَحَسْبُنَا اللّٰهُ وَنِعْمَ الْوَكِيْلُ | وَلَا حَوْلَ وَلَا قُوَّةَ | إِلَّا بِاللّٰهِ الْعَلِيِّ الْعَظِيْمِ"
  frasa: "Dan cukuplah Allah bagi kami, dan Dialah sebaik-baik tempat berserah | Tiada daya (menolak keburukan) dan tiada kekuatan (melakukan kebaikan) | melainkan dengan (pertolongan) Allah Yang Maha Tinggi lagi Maha Agung"
  rumi: "Wa hasbunallaahu wa ni'mal wakiil, wa laa haula wa laa quwwata illaa billaahil 'aliyyil 'aziim."
  makna: "Cukuplah Allah bagi kami, dan Dialah sebaik-baik tempat berserah. Tiada daya dan tiada kekuatan melainkan dengan pertolongan Allah Yang Maha Tinggi lagi Maha Agung."

- id: zikir-istighfar-azim
  tajuk: Istighfar
  kat: [tahlil, zikir]
  tag: [istighfar, tahlil]
  ulang: 3
  sumber: {jenis: buku, ruj: "Buku Yaasiin, ms 44", darjat: amalan}
