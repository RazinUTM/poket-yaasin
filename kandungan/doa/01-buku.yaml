- id: selawat-habib
  tajuk: Selawat kepada kekasih Allah
  kat: [tahlil, selawat]
  tag: [selawat, tahlil]
  ulang: 2
  sumber: {jenis: buku, ruj: "Buku Yaasiin, ms 46", darjat: amalan}
  teks: "اَللّٰهُمَّ صَلِّ عَلَى حَبِيْبِكَ | سَيِّدِنَا مُحَمَّدٍ | وَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ"
  frasa: "Ya Allah, limpahkanlah selawat ke atas kekasih-Mu | penghulu kami Muhammad | serta keluarga dan sahabatnya, dan kurniakanlah kesejahteraan"
  rumi: "Allaahumma salli 'alaa habiibika sayyidinaa Muhammadin wa 'alaa aalihii wa sahbihii wa sallim."
  makna: "Ya Allah, limpahkanlah selawat ke atas kekasih-Mu, penghulu kami Muhammad, serta keluarga dan sahabat baginda, dan kurniakanlah kesejahteraan."

- id: selawat-habib-rasul
  tajuk: Selawat penutup zikir
  kat: [tahlil, selawat]
  tag: [selawat, tahlil]
  sumber: {jenis: buku, ruj: "Buku Yaasiin, ms 46", darjat: amalan}
  teks: "اَللّٰهُمَّ صَلِّ عَلَى حَبِيْبِكَ وَرَسُوْلِكَ | سَيِّدِنَا وَمَوْلَانَا مُحَمَّدٍ | وَعَلَى آلِهِ وَصَحْبِهِ | وَبَارِكْ وَسَلِّمْ"
  frasa: "Ya Allah, limpahkanlah selawat ke atas kekasih-Mu dan rasul-Mu | penghulu dan pemimpin kami Muhammad | serta keluarga dan sahabatnya | dan limpahkanlah keberkatan dan kesejahteraan"
  rumi: "Allaahumma salli 'alaa habiibika wa rasuulika sayyidinaa wa maulaanaa Muhammadin wa 'alaa aalihii wa sahbihii wa baarik wa sallim."
  makna: "Ya Allah, limpahkanlah selawat ke atas kekasih dan rasul-Mu, penghulu dan pemimpin kami Muhammad, serta keluarga dan sahabat baginda, dan limpahkanlah keberkatan dan kesejahteraan."

