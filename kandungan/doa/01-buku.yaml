  tajuk: Sebaik-baik zikir
  kat: [tahlil, zikir]
  tag: [tahlil, kalimah tauhid]
  sumber: {jenis: hadis, ruj: "Jami' at-Tirmizi, no. 3383 (lafaz asal: \"Afdhaluz zikri laa ilaaha illallaah\")", darjat: Hasan, url: "https://sunnah.com/tirmidhi:3383", nota: "Buku ms 44 memendekkan; ms 55 memakai lafaz penuh di bawah. Frasa فَاعْلَمْ أَنَّهُ ialah tambahan lazim dalam tahlil, dipetik daripada {{47:19}}.", semak_kecuali: ["فَاعْلَمْ أَنَّهُ"]}
  teks: "أَفْضَلُ الذِّكْرِ | فَاعْلَمْ أَنَّهُ | لَا إِلٰهَ إِلَّا اللّٰهُ"
  frasa: "Sebaik-baik zikir | maka ketahuilah bahawa ia (ialah) | tiada tuhan melainkan Allah"
  rumi: "Afdhaludz dzikri ⟨47:19⟩."
  makna: "Sebaik-baik zikir — ketahuilah — ialah: Laa ilaaha illallaah (tiada tuhan melainkan Allah)."

