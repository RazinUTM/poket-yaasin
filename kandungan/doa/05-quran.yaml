  quran: "25:74#3-"
  makna: "Wahai Tuhan kami, kurniakanlah kepada kami pasangan dan zuriat yang menyejukkan mata, dan jadikanlah kami ikutan bagi orang-orang yang bertakwa."

- id: q-awzi-ni-sulaiman
  tajuk: "Doa Nabi Sulaiman: ilham untuk bersyukur"
  kat: [quran, jiwa]
  tag: [syukur, kejayaan, ibu bapa, amal soleh]
  quran: "27:19#6-"
  makna: "Wahai Tuhanku, ilhamkanlah aku untuk mensyukuri nikmat-Mu yang Engkau kurniakan kepadaku dan kedua ibu bapaku, dan untuk mengerjakan amal soleh yang Engkau redai; dan masukkanlah aku dengan rahmat-Mu ke dalam golongan hamba-hamba-Mu yang soleh."

- id: q-lima-anzalta
  tajuk: "Doa Nabi Musa: berhajat kepada kebaikan"
  kat: [quran, rezeki]
  tag: [rezeki, kerja, jodoh, perniagaan, hajat]
  quran: "28:24#8-"
  makna: "Wahai Tuhanku, sesungguhnya aku sangat berhajat kepada apa jua kebaikan yang Engkau turunkan kepadaku."

- id: q-hab-li-salihin
  tajuk: Kurniakan zuriat yang soleh
  kat: [quran, keluarga]
  tag: [zuriat, anak, hamil]
  quran: "37:100"
  makna: "Wahai Tuhanku, kurniakanlah kepadaku (anak) dari kalangan orang-orang yang soleh."

- id: q-ufawwidu
