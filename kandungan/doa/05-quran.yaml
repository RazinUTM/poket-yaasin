  quran: "20:25#2-, 20:26-28"
  makna: "Wahai Tuhanku, lapangkanlah dadaku, mudahkanlah urusanku, dan lepaskanlah kekakuan lidahku supaya mereka memahami perkataanku."

- id: q-zidni-ilma
  tajuk: Tambahkan aku ilmu
  kat: [quran, ilmu]
  tag: [ilmu, belajar, pelajar, peperiksaan]
  quran: "20:114#15-"
  makna: "Wahai Tuhanku, tambahkanlah aku ilmu."

- id: q-ayyub
  tajuk: Doa Nabi Ayyub ketika sakit
  kat: [quran, sakit]
  tag: [sakit, penyakit kronik, ujian, kanser, pesakit]
  quran: "21:83#5-"
  makna: "(Wahai Tuhanku) sesungguhnya aku ditimpa penyakit, dan Engkaulah Yang Paling Mengasihani di antara yang mengasihani."

- id: q-yunus
  tajuk: Doa Nabi Yunus (zikir dalam kesempitan)
  kat: [quran, jiwa]
  tag: [kesusahan, taubat, kesempitan, zikir yunus, terperangkap]
  quran: "21:87#15-"
  makna: "Tiada tuhan melainkan Engkau, Maha Suci Engkau; sesungguhnya aku termasuk dalam golongan orang yang zalim."
  nota: "Tiada seorang muslim pun berdoa dengannya dalam sesuatu urusan melainkan Allah memperkenankannya (Jami' at-Tirmizi, no. 3505)."

- id: q-zuriat-tidak-bersendirian
