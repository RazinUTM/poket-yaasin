  kat: [quran, perlindungan]
  tag: [syaitan, was-was, gangguan, perlindungan]
  quran: "23:97#2-, 23:98"
  makna: "Wahai Tuhanku, aku berlindung kepada-Mu daripada hasutan syaitan-syaitan, dan aku berlindung kepada-Mu, wahai Tuhanku, daripada kehadiran mereka kepadaku."

- id: q-ighfir-warham
  tajuk: Ampunilah dan rahmatilah
  kat: [quran, jiwa]
  tag: [keampunan, rahmat]
  quran: "23:118#2-"
  makna: "Wahai Tuhanku, ampunilah dan rahmatilah; Engkaulah sebaik-baik pemberi rahmat."

- id: q-qurrata-ayun
