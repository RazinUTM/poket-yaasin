  kat: [quran, jiwa]
  tag: [tawakal, keputusan, kezaliman, tekanan kerja]
  quran: "40:44#5-"
  makna: "Dan aku serahkan urusanku kepada Allah; sesungguhnya Allah Maha Melihat akan hamba-hamba-Nya."

- id: q-kenderaan
  tajuk: Menaiki kenderaan
  kat: [quran, musafir, harian]
  tag: [kenderaan, kereta, motosikal, kapal terbang, bas, kereta api]
  quran: "43:13#12-, 43:14"
  makna: "Maha Suci (Allah) yang telah menundukkan kenderaan ini bagi kami, sedangkan kami tidak mampu menguasainya; dan sesungguhnya kepada Tuhan kamilah kami akan kembali."
  nota: "Sunnah: baca \"Bismillaah\" ketika meletak kaki, \"Alhamdulillaah\" ketika duduk, kemudian ayat ini (Sunan Abi Dawud, no. 2602 — disahihkan al-Albani; Sahih Muslim, no. 1342)."

- id: q-umur-40
  tajuk: Doa usia 40 tahun
  kat: [quran, keluarga]
  tag: [umur 40, ibu bapa, zuriat, taubat, syukur]
  quran: "46:15#22-"
  makna: "Wahai Tuhanku, ilhamkanlah aku untuk mensyukuri nikmat-Mu yang Engkau kurniakan kepadaku dan kedua ibu bapaku, dan untuk mengerjakan amal soleh yang Engkau redai; perbaikilah zuriat keturunanku. Sesungguhnya aku bertaubat kepada-Mu dan aku termasuk orang yang berserah diri."

- id: q-lil-ikhwan
  tajuk: Untuk saudara seiman yang telah pergi
  kat: [quran, kematian, ummah]
  tag: [arwah, si mati, ukhuwah, perpaduan, dendam, rabbana]
  quran: "59:10#6-"
  makna: "Wahai Tuhan kami, ampunkanlah kami dan saudara-saudara kami yang telah mendahului kami dalam iman, dan janganlah Engkau jadikan dalam hati kami perasaan dendam terhadap orang-orang yang beriman. Wahai Tuhan kami, sesungguhnya Engkau Amat Belas Kasihan lagi Maha Mengasihani."

- id: q-alaika-tawakkalna
  tajuk: Kepada-Mu kami bertawakal
  kat: [quran, jiwa]
  tag: [tawakal, taubat, rabbana]
  quran: "60:4#46-"
  makna: "Wahai Tuhan kami, kepada-Mu kami bertawakal, kepada-Mu kami kembali bertaubat, dan kepada-Mu tempat kembali."

- id: q-atmim-nurana
  tajuk: Sempurnakanlah cahaya kami
  kat: [quran, jiwa]
  tag: [taubat, cahaya, akhirat, rabbana]
  quran: "66:8#35-"
  makna: "Wahai Tuhan kami, sempurnakanlah cahaya kami dan ampunkanlah kami; sesungguhnya Engkau Maha Berkuasa atas segala sesuatu."

- id: q-nuh
  tajuk: Doa Nabi Nuh untuk ibu bapa dan mukmin
  kat: [quran, keluarga]
  tag: [ibu bapa, rumah, mukmin, keampunan]
  quran: "71:28"
  makna: "Wahai Tuhanku, ampunkanlah aku, kedua ibu bapaku, sesiapa yang masuk ke rumahku dengan beriman, serta orang-orang mukmin lelaki dan perempuan; dan janganlah Engkau tambahkan orang-orang zalim melainkan kebinasaan."

- id: q-mustadhafin
  tajuk: Doa golongan yang tertindas
  kat: [quran, ummah]
  tag: [palestin, gaza, pelarian, mangsa perang, tertindas, rohingya]
  quran: "4:75#15-"
  makna: "Wahai Tuhan kami, keluarkanlah kami dari negeri yang penduduknya zalim ini, dan berikanlah kami pelindung serta penolong dari sisi-Mu."

- id: q-ayat-kursi
  tajuk: Ayat Kursi (pendinding)
  kat: [quran, perlindungan]
  tag: [pendinding, tidur, selepas solat, gangguan]
  quran: "2:255"
  nota: "Sesiapa membacanya ketika hendak tidur, sentiasa ada penjaga daripada Allah dan syaitan tidak akan mendekatinya hingga pagi (Sahih al-Bukhari, no. 2311)."

- id: q-tiga-qul
  tajuk: Tiga Qul (al-Ikhlas, al-Falaq, an-Nas)
  kat: [quran, perlindungan, pagi-petang]
  tag: [pendinding, pagi, petang, tidur, ruqyah]
  ulang: 3
  quran: "112:1-4, 113:1-5, 114:1-6"
  nota: "Dibaca 3 kali pagi dan petang, ia mencukupi daripada segala sesuatu (Sunan Abi Dawud, no. 5082 — hasan menurut al-Albani). Rasulullah ﷺ juga membacanya sebelum tidur lalu menghembus ke tapak tangan dan menyapu badan (Sahih al-Bukhari, no. 5017)."
