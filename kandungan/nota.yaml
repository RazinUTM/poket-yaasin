- id: puasa-nabi
  kumpulan: amalan
  tajuk: "Cara Nabi ﷺ berpuasa sunat: setiap minggu, setiap bulan dan bermusim"
  ringkas: Isnin dan Khamis, tiga hari sebulan, corak Sabtu hingga Khamis, Jumaat sebagai hari raya mingguan, hari Sabtu, puasa Daud, Syaaban dan awal Zulhijjah.
  kata: [puasa nabi, puasa sunnah, cara nabi berpuasa, puasa isnin, puasa khamis, puasa jumaat, puasa sabtu, puasa ahad, puasa selasa, puasa rabu, tiga hari sebulan, ayyamul bidh, puasa daud, puasa syaaban, puasa zulhijjah, puasa sepanjang tahun, hari raya mingguan, kelebihan puasa]
  disemak: 2026-11-02
  isi: |-
    Nabi ﷺ tidak berpuasa sunat mengikut satu jadual yang tetap. Ada masanya baginda berpuasa berturut-turut sehingga sahabat menyangka baginda tidak akan berbuka, dan ada masanya sebaliknya; baginda tidak pernah berpuasa sebulan penuh selain Ramadan (Sahih al-Bukhari 1969; Sahih Muslim 1156e). Yang tetap ialah beberapa kebiasaan di bawah. Darjat hadis sunan mengikut penilaian yang dipaparkan sunnah.com. Senarai hari sunat dan hari dilarang ada dalam [[puasa-sunat]]; niat, berbuka dan soalan lazim dalam [[puasa-adab]].

    **Setiap minggu: Isnin dan Khamis**
    - Nabi ﷺ berusaha berpuasa pada hari Isnin dan Khamis (Jami' at-Tirmizi 745, sahih). Amalan dibentangkan kepada Allah pada dua hari ini, dan baginda suka amalannya dibentangkan ketika baginda berpuasa (Jami' at-Tirmizi 747, hasan).
    - Apabila ditanya tentang puasa hari Isnin, baginda menjawab bahawa itulah hari baginda dilahirkan dan hari wahyu mula diturunkan kepada baginda (Sahih Muslim 1162b).

    **Setiap bulan: tiga hari**
    - Abu Hurairah diwasiatkan tiga perkara oleh Nabi ﷺ: puasa tiga hari setiap bulan, dua rakaat Dhuha, dan witir sebelum tidur (Sahih al-Bukhari 1981).
    - Setiap kebaikan dibalas sepuluh kali ganda, jadi puasa tiga hari sebulan menyamai puasa sepanjang tahun (Sahih al-Bukhari 1975; Sahih Muslim 1162a).
    - Aisyah ditanya pada hari apa Nabi ﷺ berpuasa tiga hari itu. Jawabnya, baginda tidak menetapkan hari tertentu dalam bulan (Sahih Muslim 1160). Riwayat lain menyebut cara yang berbeza: tiga hari pada awal bulan (Jami' at-Tirmizi 742, hasan); Isnin pertama dalam bulan dan hari Khamis (Sunan Abi Dawud 2437, sahih menurut al-Albani); dan 13, 14 dan 15 haribulan Hijri, iaitu Ayyamul Bidh (Jami' at-Tirmizi 761). Semuanya cara memenuhi tiga hari sebulan.

    **Corak Sabtu hingga Khamis.** Aisyah meriwayatkan bahawa dalam satu bulan Nabi ﷺ berpuasa pada hari Sabtu, Ahad dan Isnin, dan pada bulan berikutnya pada hari Selasa, Rabu dan Khamis (Jami' at-Tirmizi 746). Darussalam menilai riwayat ini da'if. Perhatikan susunannya: Sabtu, Ahad, Isnin, kemudian Selasa, Rabu, Khamis; bukan Ahad, Isnin, Selasa. Dalam dua bulan, corak ini meliputi semua hari dalam seminggu kecuali Jumaat. Mengamalkannya tetap termasuk dalam puasa tiga hari sebulan yang sabit dalam hadis sahih di atas, tetapi jangan menganggapnya sunnah khusus yang sabit kuat.

    **Jumaat: hari raya mingguan**
    - Nabi ﷺ menyebut hari Jumaat sebagai hari raya yang Allah jadikan untuk umat Islam, lalu menganjurkan mandi, memakai wangian dan bersugi (Sunan Ibn Majah 1098, hasan).
    - Jangan berpuasa pada hari Jumaat sahaja; berpuasalah sehari sebelum atau selepasnya (Sahih al-Bukhari 1985; Sahih Muslim 1144a). Jangan juga mengkhususkan malam Jumaat untuk qiyam dan siangnya untuk puasa, kecuali jika ia jatuh dalam puasa yang biasa dilakukan (Sahih Muslim 1144b), contohnya hari Arafah atau Asyura yang jatuh pada hari Jumaat.
    - Juwairiyah pernah berpuasa pada hari Jumaat. Nabi ﷺ bertanya sama ada dia berpuasa semalam atau berniat berpuasa esok; apabila dia menjawab tidak, baginda menyuruhnya berbuka (Sahih al-Bukhari 1986). Soalan itu juga menunjukkan bahawa puasa Jumaat yang disambung dengan Sabtu dibenarkan.
    - Ibn Mas'ud melaporkan bahawa Nabi ﷺ jarang tidak berpuasa pada hari Jumaat (Jami' at-Tirmizi 742, hasan). Jadi yang dilarang ialah mengkhususkan Jumaat seorang diri, bukan berpuasa pada hari Jumaat. Jika mahu berpuasa pada hari Jumaat, sertakan hari Khamis atau Sabtu.

    **Sabtu: ada perbezaan pendapat**
    - Ada hadis yang melarang berpuasa pada hari Sabtu kecuali puasa yang difardukan (Jami' at-Tirmizi 744, hasan; Sunan Abi Dawud 2421, sahih menurut al-Albani; Sunan Ibn Majah 1726, hasan). Ulama berbeza pendapat tentang maksud dan kekuatan hadis ini.
    - Pejabat Mufti WP (Al-Kafi #563): dalam mazhab Syafi'i, makruh berpuasa sunat pada hari Sabtu sahaja atau Ahad sahaja, kerana hari itu dibesarkan oleh Yahudi dan Nasrani; begitu juga hari Jumaat sahaja. Hukum makruh itu tidak terpakai jika puasa disambung dengan hari sebelum atau selepasnya, atau jika ia bertepatan dengan kebiasaan, hari yang disunatkan seperti Arafah dan Asyura, puasa Daud, qada atau nazar. Berpuasa Sabtu dan Ahad bersama-sama pula tidak makruh, kerana tiada golongan yang membesarkan kedua-dua hari itu serentak (Irsyad Fatwa Edisi Khas Ramadhan, Soalan 44).
    - Hadis Juwairiyah di atas menunjukkan bahawa Nabi ﷺ membenarkan puasa hari Sabtu yang disambung dengan hari Jumaat.

    **Puasa Daud, dan berpuasa setiap hari**
    - Puasa yang paling disukai Allah ialah puasa Nabi Daud: sehari berpuasa dan sehari berbuka (Sahih al-Bukhari 1131). Pejabat Mufti WP (Irsyad Hukum Siri 887): sunat bagi yang mampu tanpa mengabaikan tanggungjawab. Jika giliran berpuasa jatuh pada hari Jumaat, teruskan kerana ia rutin, bukan mengkhususkan Jumaat; jika jatuh pada Hari Raya atau hari Tasyrik, wajib berbuka.
    - Abdullah bin Amr berazam untuk berpuasa setiap hari dan bersolat sepanjang malam. Nabi ﷺ melarangnya: badan, isteri dan tetamunya masing-masing ada hak ke atasnya, dan tiga hari sebulan sudah mencukupi. Apabila tua, Abdullah berharap dia menerima keringanan itu (Sahih al-Bukhari 1975). Tentang orang yang berpuasa sepanjang masa, baginda bersabda dia tidak berpuasa dan tidak pula berbuka (Sahih Muslim 1162a). Dalam mazhab Syafi'i, berpuasa setiap hari selain hari yang dilarang tidak makruh bagi yang mampu, tetapi makruh jika memudaratkan diri atau mengabaikan tanggungjawab; puasa Daud tetap lebih afdal (Irsyad Hukum Siri 887).
    - Nabi ﷺ berpesan supaya beramal sekadar yang mampu, kerana Allah tidak jemu memberi ganjaran sehingga kita sendiri yang jemu; solat yang paling baginda sukai ialah yang dikekalkan walaupun sedikit (Sahih al-Bukhari 1970).

    **Bermusim**
    - **Syaaban**: bulan Nabi ﷺ paling banyak berpuasa sunat (Sahih al-Bukhari 1969 dan 1970). Baginda menjelaskan bahawa Syaaban ialah bulan yang dilalaikan manusia antara Rejab dan Ramadan, ketika amalan diangkat kepada Allah, dan baginda suka amalannya diangkat ketika berpuasa (Sunan an-Nasa'i 2357, hasan). Tentang separuh kedua Syaaban, lihat [[puasa-sunat]].
    - **Awal Zulhijjah**: tiada amal soleh yang lebih disukai Allah daripada amal pada sepuluh hari pertama Zulhijjah (Sahih al-Bukhari 969). Salah seorang isteri Nabi ﷺ melaporkan baginda berpuasa pada sembilan hari pertamanya (Sunan Abi Dawud 2437), dan Hafsah menyebutnya antara empat amalan yang tidak ditinggalkan baginda (Sunan an-Nasa'i 2416, hasan). Aisyah pula berkata dia tidak pernah melihat baginda berpuasa pada hari-hari itu (Sahih Muslim 1176a). Menurut al-Nawawi, yang dinukil Pejabat Mufti WP, kata-kata Aisyah tidak menafikan baginda berpuasa pada hari-hari itu, dan seseorang boleh berpuasa pada semua atau sebahagian daripadanya. Hadis yang menjanjikan ganjaran khusus bagi puasa setiap hari dari 1 hingga 9 Zulhijjah pula palsu; yang sabit ialah kelebihan hari Arafah (Irsyad al-Hadith Siri 401). 10 Zulhijjah ialah Hari Raya, dilarang berpuasa.
    - **Muharam, Asyura, Arafah dan enam hari Syawal**: lihat [[puasa-sunat]].

    **Kelebihan berpuasa**
    - Puasa ialah perisai (Sahih al-Bukhari 1894).
    - Di syurga ada pintu bernama ar-Rayyan, khusus untuk orang yang berpuasa (Sahih al-Bukhari 1896).
    - Sesiapa berpuasa sehari pada jalan Allah, Allah menjauhkan wajahnya dari neraka sejauh perjalanan tujuh puluh tahun (Sahih al-Bukhari 2840).
    - Orang yang berpuasa mendapat dua kegembiraan: ketika berbuka, dan ketika bertemu Tuhannya (Sahih al-Bukhari 1904).
    - Doa orang yang berpuasa hingga dia berbuka antara doa yang tidak ditolak. Lihat [[waktu-mustajab]].
  sumber:
    - {t: "Jami' at-Tirmizi 746 (puasa Sabtu hingga Khamis)", p: "sunnah.com", u: "https://sunnah.com/tirmidhi:746"}
    - {t: "Sahih Muslim 1160 (tiga hari sebulan, tanpa hari tertentu)", p: "sunnah.com", u: "https://sunnah.com/muslim:1160"}
