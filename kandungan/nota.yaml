- id: waktu-mustajab
  kumpulan: adab
  tajuk: Waktu dan keadaan doa mustajab
  ringkas: Sepertiga malam, sujud, antara azan dan iqamah, saat Jumaat, ketika berbuka dan lain-lain.
  disemak: 2026-11-01
  isi: |
    Senarai ini dihimpun daripada artikel Pejabat Mufti WP dan disemak dengan teks hadis. Gred ialah seperti yang dicatat sumber.

    - **Sepertiga akhir malam**: Allah turun ke langit dunia dan memperkenankan doa (Sahih al-Bukhari 1145). Ada satu saat setiap malam yang doa dikabulkan (Sahih Muslim 757a).
    - **Ketika sujud**: saat hamba paling dekat dengan Tuhannya (Sahih Muslim 482).
    - **Antara azan dan iqamah**: doa tidak ditolak (Jami' at-Tirmizi 212, sahih menurut Darussalam).
    - **Saat mustajab hari Jumaat** (Sahih al-Bukhari 935). Riwayat Sahih Muslim 853 menyebut antara imam duduk di atas mimbar hingga selesai solat; Pejabat Mufti WP cenderung kepada akhir waktu selepas Asar.
    - **Orang berpuasa hingga dia berbuka, dan ketika berbuka**, pemimpin yang adil dan orang yang dizalimi (Jami' at-Tirmizi 3598; Sunan Ibn Majah 1752–1753; hasan menurut Darussalam).
    - **Doa ibu bapa untuk anaknya, doa musafir, doa orang yang dizalimi** (Sunan Ibn Majah 3862: hasan menurut Darussalam, hasan li ghairihi menurut Syu'aib al-Arna'ut). Hadis tular "doa ibu seperti doa Nabi kepada umatnya" pula palsu (Irsyad al-Hadith Siri 414).
    - **Ketika azan dan ketika berhadapan musuh** (Sunan Abi Dawud 2540). Tambahan "dan ketika hujan turun" dalam riwayat ini dinilai lemah oleh al-Albani; Pejabat Mufti WP memetik riwayat lain (al-Hakim) tentang doa ketika hujan.
    - **Mendoakan saudara tanpa pengetahuannya**: malaikat mendoakan perkara yang sama untuk kita (Sahih Muslim 2732a).
    - **Akhir malam dan penghujung solat fardu** (Jami' at-Tirmizi 3499: hasan menurut al-Tirmizi, dha'if menurut Darussalam).

    Lihat juga [[adab-doa]].
  sumber:
    - {t: "Irsyad al-Hadith Siri ke-393: Waktu Mustajab Pada Waktu Malam", p: "Pejabat Mufti WP, 16 Jul 2019", u: "https://muftiwp.gov.my/ms/artikel/irsyad-al-hadith/3573-irsyad-al-hadith-siri-ke-393-waktu-mustajab-pada-waktu-malam"}
    - {t: "Irsyad al-Hadith Siri ke-126: Waktu Mustajab Pada Hari Jumaat", p: "Pejabat Mufti WP, 23 Nov 2016", u: "https://muftiwp.gov.my/ms/artikel/irsyad-al-hadith/1456-irsyad-al-hadith-siri-ke-126-waktu-mustajab-pada-hari-jumaat"}
    - {t: "Irsyad al-Hadith Siri ke-196: Doa Orang Berpuasa Mustajab", p: "Pejabat Mufti WP, 30 Mei 2017", u: "https://muftiwp.gov.my/ms/artikel/irsyad-al-hadith/819-irsyad-al-hadith-siri-ke-196-doa-orang-berpuasa-mustajab"}
    - {t: "Irsyad al-Hadith Siri ke-243: Doa Ketika Turunnya Hujan", p: "Pejabat Mufti WP, 25 Jan 2018", u: "https://muftiwp.gov.my/ms/artikel/irsyad-al-hadith/2272-irsyad-al-hadith-siri-ke-243-doa-ketika-turunnya-hujan"}
    - {t: "Irsyad al-Hadith Siri ke-414: Doa Ibu Kepada Anak Seperti Doa Nabi Kepada Umat", p: "Pejabat Mufti WP, 11 Sep 2019", u: "https://muftiwp.gov.my/ms/artikel/irsyad-al-hadith/3679-irsyad-al-hadith-siri-ke-414-doa-ibu-kepada-anak-seperti-doa-nabi-kepada-umat"}
    - {t: "Irsyad al-Hadith Siri ke-108: Doa Seorang Sahabat Kepada Sahabatnya", p: "Pejabat Mufti WP, 8 Ogos 2016", u: "https://muftiwp.gov.my/ms/artikel/irsyad-al-hadith/1125-irsyad-al-hadith-siri-ke-108-doa-seorang-sahabat-kepada-sahabatnya"}
