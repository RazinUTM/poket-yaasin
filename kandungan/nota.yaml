    - {t: "Al-Kafi #1315: Manakah yang lebih afdhal di antara puasa enam atau berbuka sekiranya dijemput ke jamuan raya", p: "Pejabat Mufti WP, 4 Jul 2019", u: "https://muftiwp.gov.my/ms/artikel/al-kafi-li-al-fatawi/3543-al-kafi-1315-manakah-yang-lebih-afdhal-di-antara-puasa-enam-atau-berbuka-sekiranya-dijemput-ke-jamuan-raya"}
