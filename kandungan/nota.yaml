- id: amalan-harian
  kumpulan: amalan
  tajuk: Amalan harian Nabi ﷺ
  ringkas: Al-Mulk dan as-Sajdah sebelum tidur, al-Kahfi hari Jumaat, adab tidur dan makan, bersiwak, menyebarkan salam dan qailulah.
  kata: [amalan nabi, sunnah nabi, amalan harian, amalan jumaat, al mulk, sebelum tidur, al kahfi, adab tidur, adab makan, tangan kanan, siwak, salam, qailulah]
  disemak: 2026-11-02
  isi: |-
    Sunnah harian yang mudah diamalkan bersama keluarga. Darjat hadis sunan mengikut penilaian yang dipaparkan sunnah.com.

    - **Al-Mulk dan as-Sajdah sebelum tidur**: ada satu surah 30 ayat yang memberi syafaat kepada pembacanya sehingga dia diampunkan, iaitu Tabarak (Jami' at-Tirmizi 2891, hasan menurut Darussalam; Sunan Abi Dawud 1400, hasan menurut al-Albani). Jabir meriwayatkan Nabi ﷺ tidak tidur sehingga membaca as-Sajdah dan al-Mulk (Jami' at-Tirmizi 3404, hasan menurut Darussalam). Riwayat al-Mulk sebagai penyelamat daripada azab kubur (Jami' at-Tirmizi 2890) dha'if menurut Darussalam. Hafalan al-Mulk boleh dijejak dalam skrin Hafalan.
    - **Al-Kahfi pada hari Jumaat**: sesiapa membacanya pada hari Jumaat, cahaya menyinarinya hingga Jumaat berikutnya (Mishkat al-Masabih 2175, hasan menurut al-Albani). Pejabat Mufti WP menyenaraikannya antara amalan sunat hari Jumaat. Jawatankuasa Fatwa Negeri Perlis menyatakan ada khilaf tentang riwayat yang mengkhususkan hari Jumaat. Menghafal 10 ayat pertama al-Kahfi melindungi daripada Dajjal (Sahih Muslim 809a).
    - **Selawat pada hari Jumaat**: lihat [[selawat]].
    - **Adab tidur**: berwuduk seperti untuk solat, berbaring di lambung kanan dan membaca doa tidur (Sahih al-Bukhari 247; Sahih Muslim 2710a). Pejabat Mufti WP: berwuduk sebelum tidur hukumnya sunat.
    - **Adab makan**: sebut nama Allah, makan dengan tangan kanan dan ambil makanan yang dekat (Sahih al-Bukhari 5376); syaitan makan dan minum dengan tangan kiri (Sahih Muslim 2020a). Jika terlupa di awal, sebut "Bismillaahi awwalahuu wa aakhirah" (Sunan Abi Dawud 3767, sahih menurut al-Albani). Pejabat Mufti WP: tangan kanan sunat dan tangan kiri makruh, manakala sebahagian ulama berpandangan lebih tegas.
    - **Bersiwak**: jika tidak memberatkan umatnya, Nabi ﷺ akan menyuruh bersiwak setiap kali solat (Sahih al-Bukhari 887); baginda bersiwak apabila bangun malam (Sahih al-Bukhari 245). Pejabat Mufti WP: memberus gigi menepati sunnah bersiwak.
    - **Menyebarkan salam**: kamu tidak beriman sehingga saling mengasihi, dan sebarkanlah salam (Sahih Muslim 54a); berilah salam kepada orang yang dikenali dan yang tidak dikenali (Sahih al-Bukhari 12). Yang berkenderaan memberi salam kepada yang berjalan, yang berjalan kepada yang duduk, yang sedikit kepada yang ramai (Sahih al-Bukhari 6232). Memulakan salam sunat dan menjawabnya wajib.
    - **Qailulah** (rehat atau tidur sebentar tengah hari): para sahabat qailulah selepas solat Jumaat (Sahih al-Bukhari 939), dan Nabi ﷺ pernah tidur tengah hari di rumah Ummu Sulaim (Sahih al-Bukhari 6281). Pejabat Mufti WP: sunat menurut jumhur, dan cenderung kepada waktu sebelum tergelincir matahari.
    - **Puasa sunat**: lihat [[puasa-sunat]]. **Solat sunat**: lihat [[solat-sunat]].
  sumber:
    - {t: "Al-Kafi #990: Baca surah al-Mulk untuk si mati", p: "Pejabat Mufti WP, 25 Dis 2018", u: "https://muftiwp.gov.my/en/artikel/al-kafi-li-al-fatawi/2932-al-kafi-990-baca-surah-al-mulk-untuk-si-mati"}
    - {t: "Al-Kafi #1673: Amalan sunat hari Jumaat", p: "Pejabat Mufti WP, 21 Mac 2020", u: "https://muftiwp.gov.my/ms/artikel/al-kafi-li-al-fatawi/4360-al-kafi-adakah-masih-disunatkan-amalan-amalan-pada-hari-jumaat-jika-tergugurnya-kewajipan-solat-jumaat-kerana-covid-19"}
