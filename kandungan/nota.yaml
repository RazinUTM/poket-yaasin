- id: puasa-adab
  kumpulan: hukum
  tajuk: "Puasa sunat: niat, berbuka, izin suami dan gabungan niat"
  ringkas: Niat pada siang hari, membatalkan puasa sunat, sahur, jemputan makan, isteri dan izin suami, serta qada dan puasa enam Syawal.
  kata: [niat puasa sunat, lupa niat, niat siang, batal puasa sunat, berbuka puasa sunat, izin suami, isteri puasa sunat, sahur, puasa ganti dan puasa enam, gabung niat, qada dahulu, jemputan makan]
  disemak: 2026-11-02
  isi: |-
    Ringkasan ini mengikut mazhab Syafi'i seperti yang dihuraikan Pejabat Mufti WP. Untuk soalan peribadi, rujuk Jabatan Mufti negeri anda. Lihat juga [[puasa-nabi]] dan [[puasa-sunat]].

    - **Niat**: puasa wajib (Ramadan, qada dan nazar) perlu diniatkan pada malam hari sebelum Subuh (Sunan Abi Dawud 2454, sahih menurut al-Albani). Puasa sunat pula boleh diniatkan pada siang hari jika belum makan, minum atau melakukan perkara yang membatalkan puasa sejak Subuh. Nabi ﷺ pernah bertanya kepada Aisyah sama ada ada makanan; apabila tiada, baginda berkata "kalau begitu aku berpuasa" (Sahih Muslim 1154b). Pejabat Mufti WP (Al-Kafi #1298): niat siang itu sah sebelum tergelincir matahari (masuk waktu Zohor). Niat mesti putus; niat yang digantung pada syarat, contohnya "saya berpuasa jika tiada jemputan makan", tidak sah.
    - **Sahur**: bersahurlah, kerana pada sahur ada keberkatan (Sahih al-Bukhari 1923).
    - **Berbuka di tengah hari**: pada hari lain, Nabi ﷺ dihadiahkan makanan ketika baginda berpuasa sunat, lalu baginda memakannya (Sahih Muslim 1154b). Pejabat Mufti WP: membatalkan puasa sunat dengan sengaja tanpa sebab adalah makruh dan tidak wajib diqada (Al-Kafi #1315); menggantinya pada hari lain disunatkan (Al-Kafi #1198).
    - **Jemputan makan**: jika dijemput makan ketika berpuasa, beritahu tuan rumah bahawa anda berpuasa (Sahih Muslim 1150) dan doakan mereka. Jika puasa anda memberatkan tuan rumah, contohnya makanan khas sudah disediakan, berbuka lebih baik (Al-Kafi #1315).
    - **Isteri**: isteri tidak berpuasa sunat ketika suami berada di rumah kecuali dengan izinnya (Sahih al-Bukhari 5195; Sahih Muslim 1026). Puasa Ramadan tidak memerlukan izin (Jami' at-Tirmizi 782, sahih). Pejabat Mufti WP (Al-Kafi #1748): dalam mazhab Syafi'i larangan ini membawa hukum haram; puasa tanpa izin tetap sah tetapi berdosa. Jika suami tiada di rumah, isteri boleh berpuasa, walaupun lebih baik memaklumkannya. Puasa qada yang tempohnya masih panjang juga memerlukan izin.
    - **Qada dahulu atau puasa enam?** Pejabat Mufti WP (Al-Kafi #1275): pandangan muktamad mazhab Syafi'i ialah lebih afdal berpuasa qada berasingan daripada puasa enam Syawal. Pandangan yang mengharuskan gabungan niat, antaranya fatwa Imam al-Ramli, turut dinukil, tetapi sebahagian ulama Syafi'i menyatakan pahala puasa enam tidak sempurna dengan cara itu. Sesiapa yang meninggalkan puasa Ramadan tanpa uzur perlu menyegerakan qada dan tidak boleh mendahulukan puasa enam; yang meninggalkannya kerana uzur boleh mendahulukan puasa enam kerana waktu qada luas.
    - **Hari dilarang berpuasa**: Hari Raya Aidilfitri, Hari Raya Aidiladha dan hari Tasyrik. Lihat [[puasa-sunat]].
  sumber:
