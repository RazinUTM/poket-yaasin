- id: akta-326
  kumpulan: kaedah
  tajuk: Al-Quran digital dan Akta 326
  ringkas: Kawalan KDN ke atas teks dan bahan al-Quran; status app ini.
  disemak: 2026-11-01
  isi: |
    **Akta Pencetakan Teks Al-Qur'an 1986 (Akta 326)**, dipinda melalui Akta A1696 yang berkuat kuasa 1 Sep 2023, mengawal teks al-Quran dalam apa jua bentuk, termasuk rakaman elektronik.

    - "Teks Al-Qur'an" ialah dokumen yang mengandungi satu juzuk atau lebih; ia memerlukan lesen dan perakuan Lembaga. "Bahan Al-Qur'an" ialah dokumen yang mengandungi ayat tetapi kurang daripada satu juzuk. KDN mengklasifikasikan Surah Yaasin sebagai bahan.
    - "Dokumen" ditakrif termasuk rakaman bunyi, rakaman elektronik dan pemancaran dari jarak jauh. Jadi **audio bacaan juga dikawal**: KDN pernah menyita jam dinding digital yang mengandungi audio 30 juzuk kerana tiada perakuan, dan memperakui terbitan audio selain mushaf bercetak dan digital.
    - Seksyen 14 terpakai kepada teks dan bahan: tidak boleh mengandungi kesilapan dan mesti mengikut kaedah penulisan (Rasm Uthmani) yang ditentukan Lembaga. Penalti boleh mencapai RM50,000 atau penjara lima tahun.
    - Garis panduan KDN bagi penerbitan digital mensyaratkan ayat dipaparkan dalam tulisan Arab, dan terjemahan diluluskan JAKIM (rujukan utama Tafsir Pimpinan ar-Rahman) serta disertakan dengan teks Arab. Dokumen itu tidak jelas sama ada app yang kurang daripada satu juzuk wajib memohon perakuan.
    - Bagi bahan audio, garis panduan KDN untuk buku asas pembelajaran bacaan al-Quran mensyaratkan nama qari dinyatakan, bacaan jelas dan bertajwid, dan surat kebenaran daripada qari atau penerbit asal.

    **Status app ini:** teks ayat diambil daripada Mushaf Madinah (KFGQPC) dan disemak silang secara automatik, tetapi **belum disemak atau diperakui oleh KDN**. Teks Yaasin, Tahlil dan doa berjumlah kira-kira 0.81 juzuk. Modul Hafalan tidak memuatkan teks surah; setiap surah dipaparkan sebagai butang nombor ayat. Sebelum app atau cetakannya diedarkan secara meluas, dapatkan pengesahan bertulis daripada LPPPQ/KDN.

    **Mod Selamat (aktif):** kerana audio juga "dokumen" di bawah Akta, teks DAN audio al-Quran yang boleh dimainkan dalam app dikira bersama dalam had satu juzuk: kini kira-kira 0.96 juzuk. Audio dihadkan kepada ayat yang teksnya ada dalam app (Yaasin, Tahlil, doa) dan surah lazim Ad-Dhuha hingga An-Nas kecuali Al-'Alaq dan Al-Bayyinah. Surah panjang (Al-Kahfi, As-Sajdah, Ar-Rahman, Al-Waqi'ah, Al-Mulk, Al-Insan), Al-'Alaq, Al-Bayyinah dan surah yang ditambah sendiri **dijejak sahaja** dalam Poket (tanda hafal, murajaah, rekod bacaan); audionya didengar dalam aplikasi Smart Quran yang diperakui KDN dan mempunyai audio qari. Binaan app gagal jika had ini dilepasi.

    **Audio:** app tidak menyimpan audio. Ia memainkan fail bacaan qari daripada pelayan EveryAyah (riwayat Hafs 'an 'Asim; nama qari dipaparkan). Sama ada pemain yang memainkan rakaman daripada pelayan pihak ketiga dikira "menerbitkan" teks rakaman belum jelas; soalan ini dihantar kepada LPPPQ. Audio surah panjang hanya akan dibuka semula dalam Poket jika LPPPQ membenarkannya secara bertulis.

    Terjemahan ayat ialah teks Abdullah Muhammad Basmeih daripada Tanzil.net, dan belum disemak dengan edisi Tafsir Pimpinan ar-Rahman terbitan JAKIM yang dirujuk oleh garis panduan KDN. Makna perkataan ialah draf yang belum disemak.

    **Kegunaan peribadi dan keluarga:** Akta tidak mempunyai pengecualian untuk kegunaan peribadi. Seksyen 5 mensyaratkan lesen untuk mencetak atau menerbitkan teks Al-Qur'an (satu juzuk atau lebih), dan "pencetakan" ditakrif luas, termasuk apa-apa cara menyalin perkataan dalam bentuk nyata; "menerbitkan" pula tidak ditakrif. Bagi bahan Al-Qur'an (kurang daripada satu juzuk) seperti app ini, lesen dan perakuan tidak diwajibkan, tetapi seksyen 14 tetap terpakai apabila ia diterbitkan atau diedarkan. Sama ada salinan peribadi yang melebihi satu juzuk, termasuk audio, memerlukan lesen atau perakuan ialah soalan untuk LPPPQ. Untuk teks surah panjang, KDN menggalakkan aplikasi Smart Quran yang diperakui.

    Untuk majlis, gunakan buku Yaasin bercetak yang mempunyai logo atau hologram perakuan KDN. Akta tidak mengecualikan cetakan peribadi atau cetakan kecil; seksyen 14 tetap terpakai, jadi semak setiap cetakan dengan mushaf yang diperakui.
