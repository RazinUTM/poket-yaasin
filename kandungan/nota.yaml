- id: kalendar
  kumpulan: kaedah
  tajuk: Tarikh Hijri dan cadangan ikut masa
  ringkas: Cara app memilih doa untuk hari ini, dan had ketepatan tarikh Hijri.
  disemak: 2026-11-01
  isi: |
    Halaman Utama mencadangkan doa dan majlis mengikut waktu (pagi, petang, malam), hari (malam dan hari Jumaat, Isnin dan Khamis), tarikh Hijri (Rejab, Nisfu Syaaban, Ramadan, Zulhijjah, pergantian tahun) dan peristiwa semasa.

    - **Tarikh Hijri** dikira dengan kalendar Umm al-Qura pada peranti, kemudian dilaraskan dengan jadual permulaan bulan bagi Malaysia yang disimpan dalam app. Jadual itu berdasarkan khutbah JAKIM (30 Oktober 2026 = 19 Jamadilawal 1448H) dan laporan media tentang cuti umum 2027; takwim rasmi belum disemak, dan tarikh awal Rejab serta Nisfu Syaaban ialah anggaran. Tarikh sebenar awal Ramadan, Syawal dan Zulhijjah bergantung kepada pengisytiharan rasmi. Jika tarikh dalam app berbeza, laraskan ±1 hari dalam Tetapan.
    - **Peristiwa semasa** seperti musim tengkujuh (MetMalaysia), peperiksaan SPM dan STPM (Lembaga Peperiksaan, Majlis Peperiksaan Malaysia) dan seruan solat hajat (JAKIM) mempunyai tarikh mula dan tamat. Ia dikemas kini setiap kali app diterbitkan semula.
    - Cadangan hanyalah pintasan. Semua doa boleh dibaca pada bila-bila masa.

- id: sumber-lesen
  kumpulan: kaedah
  tajuk: Sumber data dan lesen
  ringkas: Dari mana teks, terjemahan, audio, hadis dan fon datang.
  disemak: 2026-11-01
  isi: |
    App ini percuma dan bukan untuk tujuan komersial. Setiap sumber kekal milik pemiliknya; semak terma masing-masing sebelum menggunakan semula kandungan ini.

    - **Teks al-Quran**: Mushaf Madinah, Kompleks Raja Fahd (KFGQPC), riwayat Hafs 'an 'Asim, dalam pengekodan Khaled Hosny untuk fon Amiri Quran. Teks tidak diubah.
    - **Terjemahan ayat**: Abdullah Muhammad Basmeih, teks daripada Tanzil.net (belum disemak dengan edisi Tafsir Pimpinan ar-Rahman terbitan JAKIM). Terma Tanzil mengehadkan terjemahan kepada kegunaan bukan komersial.
    - **Makna perkataan (BM)**: draf disediakan untuk app ini, dengan gloss English quran.com sebagai rujukan. Perlu disemak guru.
    - **Audio ayat**: EveryAyah.com (Mishary Rashid Alafasy, Mahmoud Khalil al-Husary, Abdul Basit Abdul Samad, Muhammad Siddiq al-Minshawi). Laman itu tidak menerbitkan lesen menyeluruh bagi rakamannya; hak cipta rakaman kekal milik qari atau penerbitnya, dan audio ini bukan terbitan yang diperakui KDN. **Audio perkataan**: quran.com.
    - **Hadis**: teks, nombor dan gred daripada sunnah.com.
    - **Susunan tahlil dan doa majlis**: buku *Surah Yaasiin, Tahlil & Doa* (ISBN 983-046-278-1).
    - **Fon**: Amiri dan Amiri Quran (Khaled Hosny), Aref Ruqaa (khat Riq'ah pada kad selawat dan zikir harian, Projek Aref Ruqaa) serta Atkinson Hyperlegible Next (Braille Institute), semuanya di bawah SIL Open Font License 1.1. Ayat al-Quran sentiasa dipaparkan dengan Amiri Quran (Rasm Uthmani), tidak dengan fon khat.
    - **Kod QR**: qrcode-generator oleh Kazuhiko Arase (lesen MIT).
    - **Sempadan juz dan muka surat Mushaf Madinah** (untuk Diari mengaji): pakej quran-meta oleh Huseyn Guliyev (lesen MIT). Metadata sahaja, tiada teks.
    - **Waktu solat**: data e-Solat JAKIM melalui waktusolat.app (projek komuniti mptwaktusolat).
    - **Gambar dan watak keluarga**: diimport sebagai pek peribadi dan disimpan dalam telefon sahaja. Ia tidak berada dalam app yang diterbitkan.
    - **Bunyi peringatan solat**: app tidak membekalkan rakaman selawat atau azan pihak ketiga. Selain loceng (dijana oleh app), klip ialah rakaman atau fail pengguna sendiri, disimpan dalam telefon. Lihat [[waktu-solat]].

    Audio dimainkan terus daripada pelayan sumbernya dan memerlukan internet. Teks, makna dan nota berfungsi tanpa internet.
  sumber:
    - {t: "Tanzil — Quran Navigator & terjemahan", p: "Tanzil.net", u: "https://tanzil.net/trans/"}
    - {t: "EveryAyah — fail audio setiap ayat", p: "EveryAyah.com", u: "https://everyayah.com"}
    - {t: "Quran.com", p: "Quran.com", u: "https://quran.com"}
    - {t: "Sunnah.com", p: "Sunnah.com", u: "https://sunnah.com"}
    - {t: "Amiri", p: "Khaled Hosny", u: "https://github.com/aliftype/amiri"}
    - {t: "Atkinson Hyperlegible", p: "Braille Institute", u: "https://www.brailleinstitute.org/freefont/"}
    - {t: "Aref Ruqaa", p: "Aref Ruqaa Project Authors", u: "https://github.com/aliftype/aref-ruqaa"}
    - {t: "quran-meta", p: "Huseyn Guliyev (MIT)", u: "https://github.com/quran-center/quran-meta"}

- id: penafian
  kumpulan: kaedah
  tajuk: Penafian
  ringkas: Himpunan peribadi, bukan terbitan rasmi; dari mana setiap kandungan datang.
  disemak: 2026-11-01
  isi: |
    Poket Yaasin ialah himpunan peribadi untuk memudahkan bacaan dan rujukan. Ia **bukan terbitan rasmi** mana-mana jabatan agama, dan tidak diperakui oleh mana-mana pihak berkuasa.

    - **Teks ayat** daripada Mushaf Madinah (Mujamma' Malik Fahd), riwayat Hafs 'an 'Asim, disemak silang secara automatik. Ia belum disemak atau diperakui oleh KDN. Untuk rujukan muktamad, gunakan mushaf bercetak yang mempunyai perakuan KDN. Lihat [[akta-326]].
    - **Doa daripada hadis** disemak dengan teks hadis bernombor (sunnah.com). Doa susunan ulama dan amalan ditandakan dengan labelnya. Lihat [[darjat]].
    - **Nota hukum** meringkaskan artikel di laman rasmi mufti, JAKIM dan KDN, dengan pautan ke sumber asal. Untuk keputusan hukum peribadi, rujuk Jabatan Mufti negeri anda.
    - **Waktu solat** diambil daripada data e-Solat JAKIM melalui perkhidmatan pihak ketiga. Tanpa internet, waktu dikira secara anggaran. Lihat [[waktu-solat]].
    - **Hafalan** tidak memuatkan teks surah. **Audio qari** dimainkan daripada EveryAyah.com dan bukan rakaman yang diperakui KDN; dalam Mod Selamat, audio surah panjang didengar dalam aplikasi Smart Quran. Semak bacaan dengan mushaf bercetak berlogo KDN atau Smart Quran.
    - **Diari dan hafalan** disimpan dalam telefon ini sahaja; app tidak menghantarnya ke mana-mana. Buat sandaran sendiri dari skrin Diari.
    - **Makna perkataan** ialah draf yang sedang disemak oleh guru.

    Penafian ini menerangkan sumber kandungan; ia tidak mengecualikan app daripada undang-undang. Jumpa kesilapan? Gunakan butang "Lapor".

- id: waktu-solat
  kumpulan: kaedah
  tajuk: Waktu solat dan peringatan
  ringkas: Sumber waktu solat, zon JAKIM, kiraan anggaran, bunyi selawat dan takbir, dan had peringatan.
  kata: [waktu solat, peringatan solat, bunyi azan, nada azan, takbir, selawat peringatan, rakam suara, loceng, notifikasi, kalendar telefon, nada dering]
  disemak: 2026-11-02
  isi: |
    Waktu solat dalam app ini ialah **waktu e-Solat JAKIM** bagi zon yang anda pilih. Data diambil melalui API percuma waktusolat.app (projek komuniti yang tidak berafiliasi dengan JAKIM), kemudian disimpan dalam telefon untuk sebulan supaya boleh dibuka tanpa internet.

    - **Zon:** Malaysia dibahagikan kepada 60 zon waktu solat JAKIM. Pilih zon anda, atau tekan "Kesan lokasi": koordinat dihantar sekali kepada waktusolat.app untuk menentukan zon dan tidak disimpan oleh app.
    - **Tanpa internet dan tiada simpanan:** app mengira waktu secara astronomi bagi titik tengah zon: Subuh pada altitud matahari 18° di bawah ufuk (parameter yang diguna pakai di seluruh Malaysia sejak keputusan Muzakarah Jawatankuasa Fatwa MKI ke-116, November 2019), Isyak 18°, Asar mengikut mazhab Syafi'i, dengan ihtiyati 1 hingga 2 minit. Waktu ini ditanda **anggaran**. Dalam ujian dengan data JAKIM bagi empat zon, bezanya dalam 2 minit; zon yang luas mungkin berbeza lebih.
    - **Tarikh Hijri:** apabila data JAKIM bagi hari ini ada, tarikh Hijri di skrin Utama diambil daripadanya.

    **Peringatan** ada tiga cara, dengan had yang berbeza:

    - Dalam app: kad peringatan sebelum waktu dan ketika masuk waktu, dengan bunyi jika dihidupkan, ketika app sedang dibuka.
    - Notifikasi telefon: dihantar oleh app apabila app terbuka atau baru sahaja ditutup. Telefon boleh menghentikan app di latar belakang, jadi notifikasi tidak dijamin.
    - Kalendar telefon: muat turun fail kalendar (.ics) waktu solat 30 hari dengan penggera. Kalendar telefon memberi peringatan walaupun app ditutup. Kalendar iPhone mengekalkan penggera dalam fail; sesetengah kalendar Android (contohnya Google Calendar) memakai tetapan peringatan lalai kalendar itu, jadi semak selepas menambah.

    App web tidak boleh membunyikan peringatan tepat pada masanya ketika ditutup tanpa pelayan notifikasi (push). Ia boleh ditambah kemudian jika perlu.

    **Bunyi selawat dan takbir.** Dalam Waktu Solat, hidupkan "Bunyi peringatan", kemudian rakam suara sendiri atau pilih fail audio (maksimum 20 saat) bagi dua slot: selawat ringkas sebelum waktu, dan takbir "Allaahu akbar" dua kali ketika masuk waktu. Takbir hanya dibunyikan dalam tiga minit pertama selepas masuk waktu. Tanpa klip, app membunyikan loceng. App tidak membekalkan rakaman orang lain; rakaman keluarga sendiri boleh dikongsi melalui pek keluarga. Klip hanya berbunyi ketika app dibuka di skrin, kerana notifikasi web tidak boleh membawa bunyi sendiri; notifikasi dan kalendar memakai bunyi telefon. Pada kebanyakan telefon Android, bunyi peringatan app Kalendar boleh ditukar kepada fail audio sendiri dalam tetapan notifikasi telefon.

    **Adab.** Pejabat Mufti WP (Irsyad al-Fatwa Siri 59) menjelaskan bahawa bacaan al-Quran atau azan sebagai nada dering pada asasnya tidak salah jika adab dijaga, berdasarkan keputusan Muzakarah Jawatankuasa Fatwa Kebangsaan kali ke-77 (April 2007) tentang ayat al-Quran: jangan digunakan di tempat yang menghina seperti tandas. Memutuskan bacaan atau azan secara tiba-tiba, contohnya untuk menjawab panggilan, tidak dibenarkan. Klip selawat dan takbir bukan ayat al-Quran, tetapi app tetap memainkannya hingga habis tanpa dipotong; pilih klip yang pendek dan matikan bunyi sebelum masuk ke tandas.
  sumber:
