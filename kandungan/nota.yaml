- id: doa-beramai
  kumpulan: adab
  tajuk: Berdoa beramai-ramai dan doa majlis rasmi
  ringkas: Harus dengan syarat; garis panduan JAKIM untuk majlis rasmi.
  disemak: 2026-11-01
  isi: |
    **Selepas solat:** wirid dan doa selepas solat adalah sunat, sebaiknya dengan lafaz yang sabit. Melakukannya secara berjemaah dengan suara kuat tidak diamalkan Nabi ﷺ dan ulama berselisih pendapat; Pejabat Mufti WP cenderung meraikan amalan setempat (Irsyad Hukum Siri 9). Doa berjemaah harus dengan syarat tidak dianggap sunat solat atau mempunyai fadhilat khusus, tidak diwajibkan, dan orang yang tidak turut serta tidak dicela (Bayan Linnas Siri 94).

    **Pandangan Perlis:** Nabi ﷺ lazimnya berdoa selepas solat secara bersendirian tanpa mengangkat tangan, dan tidak berdoa secara berjemaah selepas solat fardu (JK Fatwa Perlis, 2018). Garis panduan masjid Perlis (2020) tidak mengadakan wirid berjemaah selepas solat fardu kecuali untuk mengajar dalam masa terhad. Namun berdoa untuk si mati di kubur, sama ada sendiri atau mengaminkan doa orang lain, adalah sunnah (JK Fatwa Perlis, 2019).

    **Majlis rasmi kerajaan** (Garis Panduan Doa JAKIM):
    - Pembaca doa ialah seorang Muslim, dan doa dibaca di awal majlis selama kira-kira 2–3 minit.
    - Dimulakan dengan pujian kepada Allah dan selawat.
    - Bukan Islam tidak dijemput turut berdoa.
    - Doa tidak dibaca dalam majlis yang ada arak, judi, muzik atau tarian.
    - Nama tetamu kenamaan tidak disebut dalam doa.
  sumber:
    - {t: "Irsyad Hukum ke-9: Bacaan Wirid dan Doa Selepas Solat", p: "Pejabat Mufti WP, 1 Dis 2014", u: "https://muftiwp.gov.my/ms/artikel/irsyad-hukum/umum/2049-9"}
    - {t: "Bayan Linnas Siri ke-94: Hukum Penganjuran Program Kempen Quran Hour", p: "Pejabat Mufti WP, 30 Mei 2017", u: "https://muftiwp.gov.my/ms/artikel/bayan-linnas/818-bayan-linnas-siri-ke-94-hukum-penganjuran-program-kempen-quran-hour"}
    - {t: "Supplicating After Prayer (JK Fatwa ke-36, 2018)", p: "Jabatan Mufti Negeri Perlis", u: "https://muftiperlis.gov.my/index.php/fatwa-insights/worship/1456-supplicating-after-prayer"}
    - {t: "Fatwa on Quranic Recitation at Burial Grounds (Mesyuarat ke-43, 2019)", p: "Jabatan Mufti Negeri Perlis", u: "https://muftiperlis.gov.my/index.php/fatwa-insights/worship/1472-fatwa-on-quranic-recitation-at-burial-grounds"}
