# Nota hukum, kaedah dan sumber yang dipaparkan dalam app (menu Nota).
# Format isi: perenggan dipisah baris kosong; "- " untuk senarai; **tebal**; {{s:a}} pautan ayat; [[id]] atau [[id|label]] pautan nota lain.
# Setiap nota merumus sumber dengan kata-kata sendiri (bukan petikan panjang). Kemas kini `disemak` apabila sumber disemak semula.

- id: tentang
  kumpulan: kaedah
  tajuk: Tentang app ini
  ringkas: Asal kandungan, apa yang telah disemak dan apa yang masih draf.
  disemak: 2026-11-01
  isi: |
    Poket Yaasin, Tahlil & Doa ialah app web yang berfungsi tanpa internet selepas dibuka sekali. Ia menghimpunkan Surah Yaasin, susunan tahlil arwah dan doa harian, hajat serta doa semasa, bersama makna setiap frasa dan sumber setiap doa.

    **Asas kandungan** ialah buku *Surah Yaasiin, Tahlil & Doa* (ISBN 983-046-278-1). Susunan tahlil dan doa majlis mengikut buku itu. Di tempat lafaz buku berbeza daripada lafaz lazim, perbezaan itu dinyatakan dalam nota doa berkenaan.

    **Yang telah disemak secara automatik setiap kali app dibina:**
    - Teks ayat: Mushaf Madinah (KFGQPC, riwayat Hafs 'an 'Asim) disemak silang huruf demi huruf dengan salinan KFGQPC kedua. Hasil: 6,236 ayat, 0 berbeza.
    - Lafaz doa daripada hadis: setiap frasa disemak wujud dalam teks hadis bernombor yang dirujuk (pangkalan data sunnah.com).
    - Rumi: tiada Rumi untuk ayat, dan frasa doa yang memetik ayat dikesan secara automatik. Lihat [[rumi]].

    **Yang masih draf:** makna setiap perkataan (per word) dalam Bahasa Melayu bagi ayat disediakan sebagai draf dan perlu disemak oleh guru yang bertauliah. Makna ayat penuh ialah terjemahan Abdullah Muhammad Basmeih.

    Nota hukum dalam app ini meringkaskan pandangan pihak berautoriti, terutamanya Pejabat Mufti Wilayah Persekutuan, dan menyatakan pandangan berbeza secara adil. Untuk soalan peribadi, rujuk Jabatan Mufti negeri anda.

    **Carian pintar** berjalan dalam telefon, tanpa internet dan tanpa model AI dalam talian. Ia memahami perkataan harian dan ejaan berbeza melalui kamus sinonim (disediakan dengan bantuan AI, kemudian disemak), membetulkan salah ejaan, dan memberi jawapan pantas yang dikira daripada data app (waktu solat, puasa sunat, tarikh Hijri). Carian tidak menjana teks doa, ayat atau hadis; setiap hasil ialah kandungan app yang sama seperti di skrin lain. Butang "Cari dalam laman rasmi" membuka carian Google yang terhad kepada laman mufti, dan hanya ketika itu pertanyaan dihantar ke internet.

    Jumpa kesilapan? Gunakan butang "Lapor" pada doa atau ayat berkenaan. Lihat juga [[akta-326]] dan [[sumber-lesen]].

- id: darjat
  kumpulan: kaedah
  tajuk: Maksud label sumber
  ringkas: Al-Quran, Sahih, Hasan, Diperselisihkan, Dha'if, Athar, Susunan ulama, Amalan.
  disemak: 2026-11-01
  isi: |
    Setiap doa memaparkan label sumber. Gred hadis ialah penilaian **yang dicatat oleh sumber rujukan** (contohnya penilaian dalam Sahih al-Bukhari dan Sahih Muslim, atau penilaian al-Albani dan Darussalam dalam pangkalan data sunnah.com), bukan penilaian app ini.

    - **Al-Quran**: lafaz ayat. Dipaparkan dalam tulisan Arab sahaja, dengan audio qari.
    - **Sahih / Hasan**: hadis yang diterima sebagai hujah.
    - **Diperselisihkan**: penilai hadis berbeza pendapat tentang darjatnya.
    - **Dha'if**: sanadnya lemah. Doa yang baik maknanya boleh dibaca sebagai doa umum, tetapi tidak boleh disandarkan secara pasti kepada Nabi ﷺ. Contohnya doa Rejab, lihat [[rejab]].
    - **Athar**: kata-kata atau amalan sahabat dan salaf.
    - **Susunan ulama**: doa yang disusun oleh ulama, bukan lafaz hadis. Boleh diamalkan tanpa meyakini ia sunnah yang warid daripada Nabi ﷺ atau mempunyai fadhilat khusus.
    - **Amalan**: zikir dan bacaan lazim dalam susunan tahlil yang diwarisi di Nusantara.

    Berdoa dengan lafaz sendiri yang baik maknanya juga dibenarkan; yang dilarang ialah menyandarkan lafaz itu kepada Nabi ﷺ jika ia tidak warid (Pejabat Mufti WP, Irsyad al-Hadith Siri 488). Ruang "Doa Saya" dalam app disediakan untuk tujuan ini.
  sumber:
    - {t: "Irsyad al-Hadith Siri ke-488: Adakah boleh berdoa untuk tolak bala selain doa yang warid daripada Nabi SAW?", p: "Pejabat Mufti WP, 23 Mac 2020", u: "https://muftiwp.gov.my/ms/artikel/irsyad-al-hadith/4364-irsyad-al-hadith-siri-ke-488-adakah-boleh-berdoa-untuk-tolak-bala-selain-doa-yang-warid-daripada-nabi-saw"}
    - {t: "Sunnah.com — teks, nombor dan gred hadis", p: "sunnah.com", u: "https://sunnah.com"}

- id: rumi
  kumpulan: kaedah
  tajuk: Kenapa ayat tiada Rumi?
  ringkas: Fatwa Kebangsaan 1989, syarat yang diharuskan, dan dasar app.
  disemak: 2026-11-01
  isi: |
    **Muzakarah Jawatankuasa Fatwa Majlis Kebangsaan kali ke-24 (5–6 Jun 1989)** memutuskan haram menulis atau menggunakan mana-mana bahagian ayat al-Quran dengan tulisan selain huruf Arab.

    Pejabat Mufti WP (Irsyad al-Fatwa Siri 172) menegaskan hukum asalnya haram, namun mengharuskannya dengan syarat, merujuk keputusan Jawatankuasa Fatwa Negeri Sembilan (2016): teks Arab mesti disertakan, kaedah transliterasi diterima ahli akademik, ia hanya alat pembelajaran yang bersifat sementara bagi pemula, dan terbitan itu tidak dianggap mushaf. Jawatankuasa Fatwa Perlis (2020) pula menyatakan hukum asalnya haram kecuali bagi yang terdesak untuk menunaikan fardu ain, seperti mualaf. Garis panduan KDN bagi perakuan teks al-Quran tidak membenarkan ayat ditulis dalam Rumi.

    **Dasar app ini:**
    - Ayat al-Quran tidak diberi Rumi. Dengar audio qari dan ikut teks Arab.
    - Doa dan zikir yang bukan ayat diberi Rumi sebagai bantuan sebutan, sentiasa bersama teks Arab.
    - Jika sesuatu doa memetik ayat, Rumi bagi frasa itu disembunyikan dan diganti dengan tanda ayat (contohnya "ayat 36:82"). Sentuh tanda itu untuk melihat dan mendengar ayat berkenaan.
    - Petikan ini dikesan secara automatik: setiap frasa doa yang sama dengan kira-kira 3–4 perkataan berturut-turut daripada mana-mana ayat mesti diputuskan sebelum app boleh dibina.

    **Pengecualian (keputusan editorial, perlu disahkan guru):** zikir yang diperintahkan oleh hadis untuk diucapkan, seperti istirja' ("innaa lillaahi…", Sahih Muslim 918a), "hasbunallaahu wa ni'mal wakiil" (Jami' at-Tirmizi 2431, hasan) dan "lahul mulku wa lahul hamdu…" (Sahih al-Bukhari 6403), serta ungkapan doa lazim yang kebetulan sama dengan dua hingga empat perkataan ayat, Rumi-nya dikekalkan. Asasnya: lafaz itu dibaca dengan niat zikir atau doa, bukan tilawah. Ini tafsiran app sahaja: keputusan Muzakarah 1989 dan garis panduan KDN tidak menyebut sebarang pengecualian. Senarai penuh disediakan untuk semakan.

    Rumi hanyalah bantuan sementara. Belajarlah membaca teks Arab dengan guru.
  sumber:
    - {t: "Irsyad al-Fatwa Siri 172: Hukum Menulis Al-Quran Menggunakan Abjad Roman/Latin (memetik keputusan Muzakarah ke-24, 1989)", p: "Pejabat Mufti WP, 15 Feb 2017", u: "https://muftiwp.gov.my/ms/artikel/irsyad-hukum/umum/1028-irsyad-al-fatwa-172-hukum-menulis-al-quran-menggunakan-abjad-roman-latin"}
    - {t: "Garis Panduan Permohonan Perakuan Betul Pruf Akhir Teks Al-Qur'an (perkara 4(d))", p: "KDN / LPPPQ", u: "https://admin.moha.gov.my/images/Agensi/PK/GP_Permohonan_Perakuan_Betul_Pruf_Akhir_2024-latest_update_2024.pdf"}
    - {t: "The Ruling on the Use of the Qur'an in Rumi Script… (Mesyuarat ke-45, 2020)", p: "Jabatan Mufti Negeri Perlis", u: "https://muftiperlis.gov.my/index.php/fatwa-insights/worship/1547-the-ruling-on-the-use-of-the-qur-an-in-rumi-script-and-others-for-obligatory-individual-duties"}

- id: fadhilat-yaasin
  kumpulan: hukum
  tajuk: Status hadis kelebihan Yaasin
  ringkas: Kebanyakan hadis fadhilat Yaasin lemah atau palsu; membacanya tetap digalakkan.
  disemak: 2026-11-01
  isi: |
    Pejabat Mufti WP merumuskan bahawa **kebanyakan hadis tentang kelebihan khusus Surah Yaasin adalah dha'if atau palsu**. Namun membaca al-Quran, termasuk Yaasin, tetap sangat digalakkan berdasarkan dalil umum, tanpa terikat dengan masa atau tempat tertentu.

    - **"Setiap sesuatu ada hati, dan hati al-Quran ialah Yaasin"** (riwayat al-Tirmizi, no. 2887 dalam penomboran sunnah.com): dinilai gharib oleh al-Tirmizi, dan seorang perawinya tidak dikenali. Kajian Journal of Hadith Studies (2026) mendapati dua riwayat al-Bazzar bagi lafaz ini masing-masing maudhu' dan dha'if.
    - **"Bacalah Yaasin kepada orang yang hampir mati"** (riwayat Abu Daud): dha'if, tetapi mempunyai riwayat sokongan. Pejabat Mufti WP memilih maksud "orang yang sedang nazak", dan menyatakan amalan membacanya sunat bagi yang beramal dengannya.
    - **Hadis panjang tentang pahala Yaasin seperti khatam al-Quran berkali-kali**: palsu menurut al-Albani.
    - **Mengulang ayat {{36:58}}**: dibolehkan bahkan sunat untuk tadabbur. Bilangan tiga atau tujuh kali ialah adat setempat, bukan nas (Al-Kafi #1998).

    Kesimpulan: bacalah Yaasin sebagai bacaan al-Quran dan zikir, tanpa menyandarkan fadhilat yang tidak sahih kepada Nabi ﷺ. Lihat juga [[yaasin-jumaat]].
  sumber:
    - {t: "Irsyad al-Hadith Siri ke-58: Kelebihan membaca surah Yasin", p: "Pejabat Mufti WP, 5 Mei 2016", u: "https://muftiwp.gov.my/ms/artikel/irsyad-al-hadith/1150-irsyad-al-hadith-siri-ke-58-kelebihan-membaca-dan-surah"}
    - {t: "Irsyad al-Hadith Siri ke-117: Status hadith 'Bacalah Yasin kepada orang yang mati'", p: "Pejabat Mufti WP, 28 Sep 2016", u: "https://muftiwp.gov.my/artikel/irsyad-al-hadith/1096-irsyad-al-hadith-siri-ke-117-status-hadith-bacalah-yasin-kepada-orang-yang-mati"}
    - {t: "Al-Kafi #1998: Mengulang ayat 58 Surah Yasin", p: "Pejabat Mufti WP, 8 Ogos 2024", u: "https://muftiwp.gov.my/ms/artikel/al-kafi-li-al-fatawi/5974"}
    - {t: "Hadis 'Yasin Jantung Al-Qur'an' dalam Musnad al-Bazzar (Journal of Hadith Studies 11(1))", p: "USIM, Jun 2026", u: "https://journalofhadith.usim.edu.my/index.php/johs/article/view/447"}

- id: tahlil
  kumpulan: hukum
  tajuk: Majlis tahlil dan menghadiahkan pahala
  ringkas: Khilafiah yang harus; doa dan sedekah disepakati sampai; pandangan Perlis berbeza pada bentuk majlis.
  disemak: 2026-11-01
  isi: |
    **Kedudukan arus perdana (Pejabat Mufti WP, mazhab Syafi'i):** bacaan Yaasin, tahlil dan kenduri arwah ialah perkara khilafiah yang harus, dan tidak wajar dipertikaikan secara meluas.

    - Pahala **doa dan sedekah** untuk si mati disepakati sampai. Antara dalilnya, hadis tiga amalan yang tidak terputus selepas mati (Sahih Muslim 1631) dan hadis sedekah untuk ibu yang meninggal dunia secara mengejut (Sunan Ibn Majah 2717).
    - Pahala **bacaan al-Quran** diperselisihkan. Pandangan masyhur mazhab Syafi'i: tidak sampai. Sebahagian ulama Syafi'i, mazhab Hanafi dan Hanbali: sampai. Pejabat Mufti WP cenderung kepada pandangan yang mengharuskan.
    - Imam al-Nawawi menganjurkan pembaca berdoa selepas membaca supaya pahala disampaikan kepada si mati. Sebab itu doa tahlil dalam app ini berbentuk permohonan: "Ya Allah, sampaikanlah…".
    - Jangan meyakini pahala itu pasti sampai, kerana ia bergantung kepada penerimaan doa. Pahala boleh dihadiahkan kepada ramai orang sekali gus (Al-Kafi #1742).
    - Penganjur tidak boleh menetapkan bayaran bagi setiap nama arwah (Al-Kafi #1288).

    **Pandangan berbeza (Perlis):** Mufti Perlis, Datuk Dr. Mohd Asri Zainul Abidin, menulis bahawa pandangan pahala bacaan sampai kepada si mati ialah pandangan yang kuat, dengan syarat bacaan ikhlas dan bukan kerana upah. Perbezaan Perlis terletak pada bentuk majlis: Jawatankuasa Fatwa Perlis (2018) menyatakan berhimpun di rumah si mati dan menjamu makan selepas pengebumian tidak disukai, manakala jiran memberi makan keluarga si mati adalah sunnah. Garis panduan masjid dan surau Perlis (2020) tidak membenarkan majlis tahlil arwah di masjid dan surau negeri itu.

    Hormati amalan setempat, dan ikut garis panduan negeri anda.
  sumber:
    - {t: "Al-Kafi #719: Mayat Mendapat Manfaat Sedekah Orang Hidup", p: "Pejabat Mufti WP, 12 Mac 2018", u: "https://muftiwp.gov.my/ms/artikel/al-kafi-li-al-fatawi/2340-al-kafi-719-mayat-mendapat-manfaat-sedekah-orang-hidup"}
    - {t: "Bayan Linnas Siri ke-13: Adab Islam Bagi Menghadapi Kematian", p: "Pejabat Mufti WP, 22 Feb 2015", u: "https://muftiwp.gov.my/ms/artikel/bayan-linnas/2588-bayan-linnas-siri-ke-13-adab-islam-bagi-menghadapi-kematian"}
    - {t: "Al-Kafi #1288: Hukum Memberi Sumbangan Untuk Majlis Tahlil Arwah", p: "Pejabat Mufti WP, 11 Jun 2019", u: "https://muftiwp.gov.my/ms/artikel/al-kafi-li-al-fatawi/3477-al-kafi-1288-hukum-memberi-sumbangan-untuk-majlis-tahlil-arwah"}
    - {t: "Al-Kafi #1742: Hukum Menyedekahkan Bacaan Al-Quran Kepada Lebih Daripada Seorang", p: "Pejabat Mufti WP, 9 Jul 2020", u: "https://muftiwp.gov.my/ms/artikel/al-kafi-li-al-fatawi/4572-al-kafi-1742-hukum-menyedekahkan-bacaan-al-quran-kepada-lebih-daripada-seorang"}
    - {t: "Tanya Mufti: Pendapat pahala sampai kepada si mati kuat (Datuk Dr. Mohd Asri Zainul Abidin)", p: "Kosmo, 11 Feb 2022", u: "https://www.kosmo.com.my/?p=234830"}
