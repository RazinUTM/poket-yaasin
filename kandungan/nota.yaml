    - {t: "Bayan Linnas Siri ke-310: Israel langgar gencatan senjata, masyarakat diseru terus bersolidariti dengan Palestin", p: "Pejabat Mufti WP, 7 Apr 2025", u: "https://muftiwp.gov.my/en/artikel/bayan-linnas/6210-bayan-linnas-siri-ke-310-israel-langgar-gencatan-senjata-masyarakat-diseru-terus-bersolidariti-dengan-palestin-melalui-doa-dan-menyumbang-dalam-pelbagai-bentuk"}
    - {t: "Al-Kafi #1993: Hukum Membaca Doa Qunut Nazilah ke atas Sesama Orang Islam", p: "Pejabat Mufti WP, 20 Jul 2024", u: "https://muftiwp.gov.my/en/artikel/al-kafi-li-al-fatawi/5959-al-kafi-1993-hukum-membaca-doa-qunut-nazilah-ke-atas-sesama-orang-islam"}
    - {t: "Kenyataan Media Bil. 04/2026: Solat Hajat dan Qunut Nazilah di Masjid-masjid Utama JAKIM", p: "JAKIM, 1 Mac 2026", u: "https://www.islam.gov.my/en/media-statement/4982-kenyataan-media-jabatan-kemajuan-islam-malaysia-jakim-berkenaan-pelaksanaan-solat-hajat-dan-bacaan-qunut-nazilah-di-masjid-masjid-utama-jakim"}

- id: puasa-sunat
  kumpulan: hukum
  tajuk: Puasa sunat dan hari yang dilarang berpuasa
  ringkas: Isnin dan Khamis, 13 hingga 15 Hijri, Arafah, Tasu'a dan Asyura, enam hari Syawal; Hari Raya dan Tasyrik.
  disemak: 2026-11-02
  isi: |
    Diari dalam app menanda hari-hari ini pada kalendar. Tarikh Hijri ikut takwim JAKIM apabila data waktu solat ada; jika tidak, tarikh Hijri ialah anggaran dan perlu disahkan dengan pengumuman rasmi.

    - **Isnin dan Khamis**: Nabi ﷺ berusaha berpuasa pada dua hari ini (Jami' at-Tirmizi 745, sahih menurut Darussalam), dan amalan dibentangkan pada hari Isnin dan Khamis (Jami' at-Tirmizi 747, hasan). Pejabat Mufti WP menghuraikan hadis ini dalam Irsyad al-Hadith Siri ke-231.
    - **13, 14 dan 15 setiap bulan Hijri (Ayyamul Bidh)**: Jami' at-Tirmizi 761 dan Sunan an-Nasa'i 2424 (hasan menurut Darussalam).
    - **Hari Arafah (9 Zulhijjah)**: menghapuskan dosa setahun sebelum dan setahun selepasnya; **Asyura (10 Muharam)**: menghapuskan dosa setahun sebelumnya (Sahih Muslim 1162a).
    - **Tasu'a (9 Muharam)**: Nabi ﷺ berazam untuk turut berpuasa pada hari kesembilan (Sahih Muslim 1134b). Pejabat Mufti WP menerangkan cara berpuasa Asyura dalam Irsyad al-Fatwa ke-135.
    - **Enam hari dalam bulan Syawal**: bersama Ramadan, pahalanya seperti berpuasa setahun (Sahih Muslim 1164a).
    - **Bulan Muharam**: puasa yang paling afdal selepas Ramadan (Sahih Muslim 1163a).
    - **Puasa Daud**, sehari berpuasa dan sehari berbuka: puasa yang paling disukai Allah (Sahih al-Bukhari 1131).

    **Dilarang berpuasa** pada Hari Raya Aidilfitri dan Aidiladha (Sahih al-Bukhari 1990; Sahih Muslim 1138) dan pada hari-hari Tasyrik, 11 hingga 13 Zulhijjah (Sahih Muslim 1141a). Kalendar app menanda hari-hari ini.

    **Hari Jumaat**: jangan berpuasa pada hari Jumaat sahaja tanpa sehari sebelum atau selepasnya (Sahih al-Bukhari 1985); Jumaat ialah hari raya mingguan (lihat [[puasa-nabi]]). **Hari Sabtu atau Ahad sahaja**: makruh dalam mazhab Syafi'i kecuali disambung dengan hari sebelum atau selepasnya, atau bertepatan dengan puasa yang ada sebab (Pejabat Mufti WP, Al-Kafi #563). **Separuh kedua Syaaban**: Jabatan Mufti Pahang mengingatkan puasa sunat selepas pertengahan Syaaban makruh, kecuali bagi yang sudah mula berpuasa pada separuh awal bulan itu.

    Diari juga boleh merekod puasa ganti (qada) dan puasa Ramadan. Cara Nabi ﷺ berpuasa sepanjang minggu dan bulan, termasuk hari Jumaat dan Sabtu: [[puasa-nabi]]. Niat, berbuka dan keutamaan antara qada dengan puasa enam: [[puasa-adab]]. Untuk soal hukum peribadi, rujuk Jabatan Mufti negeri anda. Lihat juga [[kalendar]].
  sumber:
    - {t: "Irsyad al-Hadith Siri ke-231: Amalan Diangkat pada Isnin dan Khamis", p: "Pejabat Mufti WP, 10 Jan 2018", u: "https://muftiwp.gov.my/ms/artikel/irsyad-al-hadith/2228-irsyad-al-hadith-siri-ke-231-amalan-diangkat-pada-isnin-dan-khamis"}
