- id: solat-sunat
  kumpulan: amalan
  tajuk: "Solat sunat: rawatib, Dhuha, tahajjud, witir dan lain-lain"
  ringkas: Rawatib 10 atau 12 rakaat, Dhuha 2 hingga 8 rakaat, tahajjud dan witir, istikharah, taubat, hajat, tasbih, tahiyyatul masjid, sunat wuduk dan tarawih.
  kata: [solat sunat, sembahyang sunat, rawatib, qabliah, badiah, solat dhuha, tahajjud, qiyamullail, solat malam, witir, istikharah, solat taubat, solat hajat, solat tasbih, tahiyyatul masjid, sunat wuduk, tarawih]
  disemak: 2026-11-02
  isi: |-
    Ringkasan dalil dan pandangan Pejabat Mufti WP bagi solat sunat yang lazim. Darjat hadis sunan mengikut penilaian yang dipaparkan sunnah.com.

    - **Rawatib** (sunat yang mengiringi solat fardu): dalam mazhab Syafi'i, yang muakkad 10 rakaat, iaitu 2 sebelum Subuh, 2 sebelum dan 2 selepas Zohor, 2 selepas Maghrib dan 2 selepas Isyak (Sahih al-Bukhari 1180). Riwayat 12 rakaat mengira 4 rakaat sebelum Zohor; sesiapa menjaga 12 rakaat sehari semalam, dibina untuknya rumah di syurga (Sahih Muslim 728a; Jami' at-Tirmizi 415, sahih menurut Darussalam).
    - **Dhuha**: waktunya selepas matahari naik (selepas syuruk) hingga sebelum tergelincir matahari, dan yang terbaik ketika matahari semakin panas (Sahih Muslim 748a). Dua rakaat Dhuha mencukupi sebagai sedekah bagi setiap sendi tubuh (Sahih Muslim 720). Nabi ﷺ solat 4 rakaat dan kadangkala lebih (Sahih Muslim 719a), dan 8 rakaat pada hari pembukaan Makkah (Sahih al-Bukhari 1176). Pejabat Mufti WP: sekurang-kurangnya 2, paling afdal 8, dan paling banyak 12 rakaat menurut al-Nawawi. Waktu Dhuha harian JAKIM ada dalam skrin Waktu Solat.
    - **Tahajjud atau qiyamullail**: solat yang paling afdal selepas solat fardu ialah solat malam (Sahih Muslim 1163b). Allah turun ke langit dunia ketika tinggal sepertiga malam terakhir dan menyeru hamba-Nya yang berdoa dan memohon ampun (Sahih al-Bukhari 1145). Pejabat Mufti WP menghuraikan tahajjud sebagai solat malam selepas bangun tidur dan sebelum masuk waktu Subuh, dan mencatat beberapa cara yang diamalkan.
    - **Witir**: jadikan witir solat terakhir pada waktu malam (Sahih al-Bukhari 998); sekurang-kurangnya 1 rakaat (Sahih al-Bukhari 990) dan yang paling sempurna 11 rakaat. Pejabat Mufti WP: 3 rakaat dengan dua salam lebih afdal.
    - **Istikharah**: solat 2 rakaat sunat diikuti doa istikharah untuk memohon petunjuk dalam sesuatu urusan, seperti yang Nabi ﷺ ajarkan (Sahih al-Bukhari 1166). Doa istikharah ada dalam senarai doa app ini.
    - **Taubat**: sesiapa yang berdosa, lalu berwuduk dengan baik, solat 2 rakaat dan memohon ampun, Allah mengampunkannya (Sunan Abi Dawud 1521, sahih menurut al-Albani). Pejabat Mufti WP menyatakan nama "solat taubat" tidak disebut dalam hadis, tetapi amalannya berdasarkan hadis ini.
    - **Hajat**: hadisnya (Jami' at-Tirmizi 479; Sunan Ibn Majah 1384) dha'if menurut Darussalam. Pejabat Mufti WP cenderung kepada pandangan jumhur fuqaha yang mengharuskannya sebagai fadhail amal, dan boleh berjemaah sekali-sekala.
    - **Tasbih**: 4 rakaat dengan 75 kali tasbih dalam setiap rakaat. Status hadisnya diperselisihkan: ada ulama yang melemahkannya dan ada yang menilainya hasan; Sunan Abi Dawud 1297 sahih menurut al-Albani. Pejabat Mufti WP menyatakan jumhur ulama berpendapat ia sunat.
    - **Tahiyyatul masjid**: 2 rakaat apabila masuk masjid sebelum duduk (Sahih al-Bukhari 444; Sahih Muslim 714a). Pejabat Mufti WP: masih boleh dilakukan jika baru duduk sebentar.
    - **Sunat wuduk**: 2 rakaat selepas berwuduk, seperti amalan Bilal yang tapak kakinya didengar Nabi ﷺ di syurga (Sahih al-Bukhari 1149). Pejabat Mufti WP: sunat, dan afdalnya sebaik sahaja selesai berwuduk.
    - **Tarawih**: sesiapa mendirikan malam Ramadan kerana iman dan mengharap pahala, diampunkan dosanya yang lalu (Sahih al-Bukhari 37). Bilangan rakaat diperselisihkan: mazhab Syafi'i dan jumhur 20 rakaat, manakala Aisyah meriwayatkan Nabi ﷺ tidak melebihi 11 rakaat (Sahih al-Bukhari 2013). Pejabat Mufti WP: yang solat kurang daripada 20 rakaat tetap mendapat pahala mengikut kadarnya. Jawatankuasa Fatwa Negeri Perlis: tiada ketetapan bilangan khusus.

    Untuk soalan khusus (niat, qada solat sunat, waktu yang dilarang), rujuk laman mufti melalui skrin Cari. Lihat juga [[waktu-mustajab]].
