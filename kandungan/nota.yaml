- id: banjir-hujan
  kumpulan: hukum
  tajuk: Hujan lebat, banjir dan "tolak hujan"
  ringkas: Doa hawalaina; upacara tolak hujan ialah khurafat.
  disemak: 2026-11-01
  isi: |
    Ketika hujan lebat yang memudaratkan, Nabi ﷺ berdoa "Allaahumma hawaalainaa wa laa 'alainaa" (Ya Allah, turunkanlah di sekeliling kami, bukan menimpa kami), riwayat Anas bin Malik dalam Sahih al-Bukhari. Ketika hujan turun, baca "Allaahumma shayyiban naafi'aa".

    - Berdoa supaya hujan yang memudaratkan beralih adalah harus. **Upacara fizikal "tolak hujan"** (contohnya menegakkan batang penyapu) ialah khurafat dan haram (Al-Kafi #1467).
    - Ayat Hud 44 ialah perintah Allah kepada langit dan bumi pada zaman Nabi Nuh, bukan lafaz doa. Ia boleh dibaca secara tawassul atau tabarruk, tetapi doa daripada al-Quran dan hadis sahih lebih utama (Al-Kafi #680).
    - Bersabar, bantu-membantu, sediakan dokumen penting dan peti kecemasan, dan patuhi amaran rasmi (Khutbah JAKIM, 6 Dis 2024).

    MetMalaysia menjangka Monsun Timur Laut 2026/2027 berlangsung dari 27 Okt 2026 hingga Mac 2027, dengan beberapa episod hujan lebat berterusan antara November dan Januari.
  sumber:
    - {t: "Irsyad al-Fatwa Siri ke-383: Hukum Hakam Berkaitan Hujan", p: "Pejabat Mufti WP, 29 Jan 2020", u: "https://www.muftiwp.gov.my/en/artikel/irsyad-fatwa/irsyad-fatwa-umum-cat/4075-irsyad-al-fatwa-siri-ke-383-hukum-hakam-berkaitan-hujan"}
    - {t: "Al-Kafi #1467: Hukum Melakukan Upacara Tolak Hujan", p: "Pejabat Mufti WP, 9 Dis 2019", u: "https://muftiwp.gov.my/ms/artikel/al-kafi-li-al-fatawi/3867-al-kafi-1467-hukum-melakukan-upacara-tolak-hujan"}
    - {t: "Al-Kafi #680: Hukum Berdoa dengan Ayat 44 Surah Hud untuk Memulihkan Banjir", p: "Pejabat Mufti WP, 10 Jan 2018", u: "https://www.muftiwp.gov.my/en/artikel/al-kafi-li-al-fatawi/2202-al-kafi-680-hukum-berdoa-dengan-ayat-44-surah-hud-untuk-memulihkan-banjir"}
    - {t: "Teks Khutbah Jumaat: Ujian Ditempuh, Kebersamaan Diperteguh", p: "JAKIM, 6 Dis 2024", u: "https://www.islam.gov.my/images/Teks_Khutbah_Jumaat_6_Disember_2024_-_Ujian_Ditempuh_Kebersamaan_Diperteguh.pdf"}
