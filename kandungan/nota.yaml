- id: adab-doa
  kumpulan: adab
  tajuk: Adab berdoa
  ringkas: Ikhlas, yakin, mulakan dengan pujian dan selawat, jangan tergesa-gesa.
  disemak: 2026-11-01
  isi: |
    Pejabat Mufti WP menyenaraikan adab berdoa berikut:

    - Ikhlas dan bersungguh-sungguh, kerana doa itu ibadah.
    - Tidak meminta perkara dosa atau memutuskan silaturahim.
    - Yakin doa akan dikabulkan dan berdoa dengan tenang.
    - Mulakan dan akhiri dengan pujian kepada Allah serta selawat ke atas Nabi ﷺ. Contohnya susunan al-Fatihah: pujian dahulu, kemudian permohonan.
    - Menjauhi yang haram dan istiqamah dalam ketaatan.
    - Tidak tergesa-gesa atau berputus asa.
    - Jangan berdoa secara bersyarat seperti "ampunilah aku jika Engkau mahu" (Sahih al-Bukhari 6339; Sahih Muslim 2679a).
    - Mengangkat tangan dan menyapu muka selepas berdoa termasuk adab, tidak wajib (Irsyad al-Hadith Siri 303). Hadisnya (Jami' at-Tirmizi 3386) dinilai gharib oleh al-Tirmizi dan hasan dengan sokongan riwayat lain oleh al-San'ani.
    - Banyakkan berdoa ketika senang supaya doa dikabulkan ketika susah (Al-Kafi #1015).

    Doa yang ikhlas tidak sia-sia: ia sama ada dikabulkan segera, disimpan sebagai ganjaran di akhirat, atau menjadi sebab dijauhkan keburukan yang setara (Irsyad al-Hadith Siri 349).
  sumber:
    - {t: "Himpunan Doa Menghadapi Dugaan dan Musibah (e-buku)", p: "Pejabat Mufti WP, 2021", u: "https://www.muftiwp.gov.my/images/pdf/penerbitan/ebook/himpunandoa/himpunandoahadapidugaandanmusibah.pdf"}
    - {t: "Al-Kafi #1015: Bagaimana Mendapatkan Doa Mustajab", p: "Pejabat Mufti WP, 31 Dis 2018", u: "https://muftiwp.gov.my/ms/artikel/al-kafi-li-al-fatawi/2968-al-kafi-1015-bagaimana-mendapatkan-doa-mustajab"}
    - {t: "Irsyad al-Hadith Siri ke-394: Larangan Ketika Berdoa", p: "Pejabat Mufti WP, 18 Jul 2019", u: "https://muftiwp.gov.my/ms/artikel/irsyad-al-hadith/3583-irsyad-al-hadith-siri-ke-394-larangan-ketika-berdoa"}
    - {t: "Irsyad al-Hadith Siri ke-303: Menyapu Muka Selepas Berdoa", p: "Pejabat Mufti WP, 22 Nov 2018", u: "https://muftiwp.gov.my/ms/artikel/irsyad-al-hadith/2792-irsyad-al-hadith-siri-ke-303-menyapu-muka-selepas-berdoa"}
    - {t: "Irsyad al-Hadith Siri ke-349: Cara Penerimaan Doa", p: "Pejabat Mufti WP, 6 Mac 2019", u: "https://muftiwp.gov.my/ms/artikel/irsyad-al-hadith/3174-irsyad-al-hadith-siri-ke-349-cara-penerimaan-doa"}

- id: selawat
  kumpulan: hukum
  tajuk: Selawat ke atas Nabi ﷺ dan selawat susunan ulama
  ringkas: Sekali selawat dibalas sepuluh; perbanyak pada hari Jumaat; Selawat Ibrahimiyah paling utama; status Tafrijiyah dan Syifa'.
  kata: [selawat, selawat nabi, tafrijiyah, nariyah, selawat syifa, tibbil qulub, ibrahimiyah, "4444 kali", selawat jumaat, kelebihan selawat]
  disemak: 2026-11-02
  isi: |-
    **Kelebihan berselawat** (semua hadis di bawah sahih):
    - Sesiapa berselawat ke atas Nabi ﷺ sekali, Allah berselawat ke atasnya sepuluh kali (Sahih Muslim 408); dihapuskan sepuluh kesalahan dan diangkat sepuluh darjat (Sunan an-Nasa'i 1297, sahih menurut Darussalam).
    - Perbanyakkan selawat pada hari Jumaat kerana selawat umat dibentangkan kepada baginda (Sunan Abi Dawud 1047, sahih menurut al-Albani). Sebab itu kad khat di skrin Utama sentiasa memaparkan selawat pada hari Jumaat.
    - Selawat sampai kepada baginda di mana sahaja kita berada (Sunan Abi Dawud 2042, sahih menurut al-Albani).
    - Selepas menjawab azan, berselawatlah ke atas Nabi ﷺ (Sahih Muslim 384a).

    **Selawat yang paling utama** ialah lafaz yang diajar sendiri oleh Nabi ﷺ apabila para sahabat bertanya cara berselawat, iaitu Selawat Ibrahimiyah (Sahih al-Bukhari 3370; Sahih Muslim 406a). Pejabat Mufti WP menyebutnya selawat yang afdal (dalam huraian solat jenazah), dan menggalakkan selawat serta zikir ajaran Nabi ﷺ diutamakan.

    **Selawat susunan ulama** (bukan lafaz hadis) harus dibaca selagi maknanya tidak bercanggah dengan syarak. Status dua yang popular:
    - **Selawat Tafrijiyah (Nariyah)**: Pejabat Mufti WP (Tashih al-Mafahim #20, 2021) menyatakan selawat ini tiada unsur syirik dan harus diamalkan, dengan keyakinan bahawa pemberi kesan yang hakiki hanyalah Allah. Perkataan "bihi" dalam "tanhallu bihil 'uqad" bermaksud dengan sebab Nabi ﷺ. Jabatan Mufti Negeri Selangor (e-Musykil) juga mengharuskannya dengan kefahaman yang betul. Penyusun asalnya diperselisihkan.
    - **Selawat Syifa' (Tibbil Qulub)**: Jawatankuasa Syariah Negeri Perlis (29 Januari 2007, tidak diwartakan) memutuskan selawat ini tidak bersumberkan al-Quran dan Sunnah, dan kandungannya bercanggah dengan prinsip akidah kerana memberi sifat ketuhanan kepada Rasulullah ﷺ. Tiada keputusan Pejabat Mufti WP atau jabatan mufti negeri lain mengenainya ditemui ketika nota ini disemak. Sebahagian masyarakat mengamalkannya sebagai doa memohon kesembuhan.

    **Bilangan khusus** seperti membaca Selawat Tafrijiyah 4444 kali tidak bersandarkan ayat atau hadis. Jika diamalkan, ia amalan sebahagian ulama, bukan sunnah Nabi ﷺ.

    **Hadis popular yang lemah:** hadis Ubay bin Ka'ab tentang menjadikan seluruh doa sebagai selawat (Jami' at-Tirmizi 2457) bergred dha'if menurut Darussalam. Lihat juga [[darjat]] dan [[adab-doa]].
  sumber:
