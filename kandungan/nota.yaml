- id: yaasin-jumaat
  kumpulan: hukum
  tajuk: Yaasin malam Jumaat
  ringkas: Harus berdasarkan dalil umum, bukan sunnah khusus.
  disemak: 2026-11-01
  isi: |
    Pejabat Mufti WP menyatakan membaca Yaasin pada malam Jumaat adalah **harus**. Nabi ﷺ tidak mengkhususkannya, tetapi ada dalil umum tentang galakan membaca al-Quran dan berhimpun untuk membacanya.

    Menjadualkan majlis Yaasin dan tahlil juga harus dengan tiga syarat: ia menjadi wasilah kepada amalan yang sabit (doa, zikir dan bacaan al-Quran), ia tidak diwajibkan, dan orang yang tidak hadir tidak dicela.

    - Hadis khusus tentang kelebihan Yaasin pada malam Jumaat sangat lemah, jadi jangan didakwa sebagai sunnah khusus (Journal of Fatwa and Falak Selangor, 2024).
    - Amalan hari Jumaat yang sabit termasuk mencari saat doa mustajab (Sahih al-Bukhari 935). Lihat [[waktu-mustajab]].
    - Bacaan di tempat kerja tidak boleh mengabaikan tugas: boleh bergilir dan dihadkan masanya (Al-Kafi Soalan 170).

    **Pandangan berbeza:** garis panduan masjid dan surau Perlis (2020) tidak membenarkan bacaan khusus pada waktu khusus tanpa dalil, termasuk Yaasin berjemaah malam Jumaat, di masjid dan surau negeri itu.
  sumber:
    - {t: "Irsyad Usul Fiqh Siri ke-78: Benarkah Asal Perkara Berkaitan Ibadah Adalah Haram?", p: "Pejabat Mufti WP, 5 Mei 2025", u: "https://muftiwp.gov.my/ms/artikel/irsyad-usul-fiqh/6228-irsyad-usul-fiqh-siri-ke-78-benarkah-asal-perkara-berkaitan-ibadah-adalah-haram"}
    - {t: "Bayan Linnas Siri ke-94: Hukum Penganjuran Program Kempen Quran Hour", p: "Pejabat Mufti WP, 30 Mei 2017", u: "https://muftiwp.gov.my/ms/artikel/bayan-linnas/818-bayan-linnas-siri-ke-94-hukum-penganjuran-program-kempen-quran-hour"}
    - {t: "Adat Bacaan Surah Yasin Malam Jumaat di Malaysia (makalah jurnal, bukan fatwa)", p: "Journal of Fatwa and Falak Selangor 1(1), 2024", u: "https://juffas.muftiselangor.gov.my/index.php/jurnal/article/download/16/9"}
    - {t: "Al-Kafi li al-Fatawi Soalan 170: Pengisian Rohani, Jangan Sampai Kerja Terabai", p: "Pejabat Mufti WP, 29 Jan 2016", u: "https://muftiwp.gov.my/en/artikel/al-kafi-li-al-fatawi/1732-pengisian-rohani-jangan-sampai-kerja-terabai"}

- id: nisfu-syaaban
  kumpulan: hukum
  tajuk: Malam Nisfu Syaaban
  ringkas: Kelebihannya sabit; tiada amalan khusus; asal-usul doa "Allaahumma yaa dzal mann".
  disemak: 2026-11-01
  isi: |
    **Kelebihan malam Nisfu Syaaban** diriwayatkan melalui beberapa jalan yang saling menguatkan, antaranya hadis keampunan Allah kepada hamba-Nya pada malam itu. Pejabat Mufti WP cenderung menerimanya, tetapi menegaskan **tiada amalan khusus** yang sabit pada malam itu selain amalan umum: zikir, istighfar, doa, solat sunat dan sedekah.

    - Solat khusus Nisfu Syaaban (seperti solat 100 rakaat) dan Solat Raghaib adalah palsu dan bid'ah menurut ulama yang dipetik dalam Irsyad al-Hadith Siri 70.
    - Membaca Yaasin tiga kali selepas Maghrib dengan doa ialah amalan lazim di Malaysia. Satu fatwa dalam portal e-SMAF JAKIM (dilaporkan oleh SAYS; jawatankuasa pengeluarnya tidak dinyatakan) menyatakan menghidupkan malam itu dengan ibadah bukan bid'ah, bahkan mustahab. Mufti Selangor menyatakan amalan malam Nisfu Syaaban khilafiah dan tidak boleh dihukum bid'ah. Niat khusus bagi setiap bacaan (seperti dalam buku: umur dalam ketaatan, iman, rezeki halal) tidak mempunyai nas khusus.
    - Pejabat Mufti WP (Irsyad Hukum Siri 29) menasihatkan agar amalan tidak dihadkan kepada malam tertentu tanpa nas sahih, atau nas dha'if yang bukan palsu.

    **Doa "Allaahumma yaa dzal manni…"** dalam app ini: menurut Dar al-Ifta' Mesir (Fatwa 3009), lafaznya berasal daripada kata-kata sahabat dan salaf, bukan hadis Nabi ﷺ. Perenggan akhirnya ("Ilaahii bit tajalliyil a'zam…") ialah **tambahan ulama terkemudian**, Syeikh Ma' al-'Ainain al-Syanqiti. Membacanya baik dan tiada larangan.

    Ayat {{44:3-4}} yang disebut dalam doa ini merujuk kepada malam al-Qadar dalam bulan Ramadan menurut Ibn Kathir dan jumhur mufassirin. Ibn Kathir menolak pandangan yang diriwayatkan daripada 'Ikrimah bahawa ia malam Nisfu Syaaban, kerana nas al-Quran menyatakan al-Quran diturunkan pada bulan Ramadan.
  sumber:
    - {t: "Irsyad al-Hadith Siri ke-70: Kelebihan Malam Nisfu Sya'ban", p: "Pejabat Mufti WP, 20 Mei 2016", u: "https://muftiwp.gov.my/ms/artikel/irsyad-al-hadith/1121-irsyad-al-hadith-siri-ke-70-kelebihan-malam-nisfu-sya-ban"}
    - {t: "Irsyad Hukum ke-29: Bulan Sya'ban: Keistimewaannya Mengikut Neraca Nas", p: "Pejabat Mufti WP, 27 Mei 2015", u: "https://muftiwp.gov.my/ms/artikel/irsyad-hukum/umum/2068-29"}
    - {t: "e-Musykil: Apakah amalan malam nisfu syaban itu bidah atau sebaliknya", p: "Jabatan Mufti Negeri Selangor, 2020", u: "https://emusykil.muftiselangor.gov.my/index.php/site/jawapan?id=1971"}
    - {t: "Amalan Pada Malam Nisfu Syaaban Bidaah Atau Tidak? (memetik e-SMAF JAKIM; sumber sekunder)", p: "SAYS, 13 Feb 2025", u: "https://says.com/my/seismik/amalan-pada-malam-nisfu-syaaban-bidaah-atau-tidak-ini-apa-yang-anda-perlu-tahu"}
    - {t: "Fatwa 3009: دعاء ليلة النصف من شعبان", p: "Dar al-Ifta' al-Misriyyah, 30 Jun 2015", u: "https://www.dar-alifta.org/ar/fatwa/details/12857/%d8%af%d8%b9%d8%a7%d8%a1-%d9%84%d9%8a%d9%84%d8%a9-%d8%a7%d9%84%d9%86%d8%b5%d9%81-%d9%85%d9%86-%d8%b4%d8%b9%d8%a8%d8%a7%d9%86"}
    - {t: "Tafsir Ibn Kathir, ad-Dukhan 44:3", p: "Quran.com", u: "https://quran.com/44:3/tafsirs/ar-tafsir-ibn-kathir"}

- id: rejab
  kumpulan: hukum
  tajuk: Doa Rejab, Syaaban dan Ramadan
  ringkas: Sanadnya sangat lemah, tetapi teksnya boleh dibaca sebagai doa umum.
  disemak: 2026-11-01
  isi: |
    Doa "Allaahumma baarik lanaa fii Rajaba wa Sya'baana wa ballighnaa Ramadhaan" diriwayatkan daripada Anas bin Malik oleh Ahmad, al-Baihaqi dan lain-lain. Pejabat Mufti WP menilai **sanadnya teramat lemah** kerana dua perawinya bermasalah, jadi ia **tidak boleh disandarkan kepada Nabi ﷺ**.

    Namun maknanya baik dan tidak bercanggah dengan syarak, jadi ia **boleh dibaca sebagai doa umum** asalkan tidak dilabel sebagai hadis sahih. Imam al-Nawawi dan Ibn Rajab turut melemahkan sanadnya.
  sumber:
    - {t: "Irsyad al-Hadith Siri ke-41: Status doa berkenaan Rejab, Syaaban dan Ramadan", p: "Pejabat Mufti WP, 11 Apr 2016", u: "https://muftiwp.gov.my/ms/artikel/irsyad-al-hadith/1526-irsyad-al-hadith-siri-ke-41-status-doa-berkenaan-rejab-syaaban-dan-ramadan"}

- id: akhir-awal-tahun
  kumpulan: hukum
  tajuk: Doa akhir dan awal tahun Hijrah
  ringkas: Doa susunan ulama; boleh diamalkan tanpa i'tiqad sunnah khusus.
  disemak: 2026-11-01
  isi: |
    Tiada hadis khusus tentang doa akhir tahun dan doa awal tahun. Sumber rasmi Malaysia memperlakukannya sebagai **doa susunan ulama yang boleh diamalkan** berdasarkan galakan umum berdoa:

    - Khutbah JHEAINS Sabah (1 Muharam 1447H) menyatakan ia boleh diamalkan pada setiap pergantian tahun walaupun tiada dalil khusus.
    - Jabatan Mufti Negeri Sembilan menerbitkan risalah doa awal dan akhir tahun untuk dibaca bersama.
    - Pejabat Mufti WP tiada artikel khusus tentang doa ini. Al-Kafi #410, tentang amalan Muharam secara umum, menyatakan amalan yang mungkin berasal daripada ulama tidak menjadi masalah selagi tidak disandarkan kepada Nabi ﷺ.

    Buku Surah Yaasiin menyarankan doa akhir tahun dibaca pada hari terakhir Zulhijjah sebelum Maghrib, dan doa awal tahun selepas Maghrib malam 1 Muharam. Amalkannya tanpa meyakini ia sunnah warid atau mempunyai fadhilat khusus.
  sumber:
    - {t: "Khutbah Jumaat: Awal Muharam: Muhasabah untuk Memantapkan Amal Soleh", p: "JHEAINS Sabah, 27 Jun 2025", u: "https://jheains.sabah.gov.my/sites/default/files/uploads/khutbah/2025-06/khutbah%2006272025.pdf"}
    - {t: "Risalah Do'a Awal dan Akhir Tahun Hijriyyah 1442H/2020M", p: "Jabatan Mufti Kerajaan Negeri Sembilan, 2020", u: "https://muftins.gov.my/wp-content/uploads/2020/08/Risalah-hijriyyah.pdf"}
    - {t: "Al-Kafi #410: Amalan-amalan dalam Bulan Muharam", p: "Pejabat Mufti WP, 24 Okt 2016", u: "https://muftiwp.gov.my/ms/artikel/al-kafi-li-al-fatawi/1265-al-kafi-410-amalan-amalan-dalam-bulan-muharam"}

- id: qunut-nazilah
  kumpulan: hukum
  tajuk: Qunut Nazilah untuk Palestin
  ringkas: Dibaca ketika musibah besar menimpa umat; tiada had tempoh; tidak terhadap sesama Muslim.
  disemak: 2026-11-01
  isi: |
    Qunut Nazilah dibaca apabila umat Islam ditimpa musibah besar, dalam semua solat fardu menurut pandangan Imam al-Nawawi. Asasnya: Nabi ﷺ berqunut sebulan dalam solat Subuh terhadap kabilah yang membunuh tujuh puluh qurra' di Bi'r Ma'unah (Sahih al-Bukhari 4090), dan berdoa dalam rakaat akhir solat Isyak untuk orang beriman yang tertindas (Sahih al-Bukhari 6393).

    - **Tiada had tempoh**: ia sunat dibaca selagi musibah belum berakhir (Irsyad Hukum Siri 813). Selepas Israel melanggar gencatan senjata, Pejabat Mufti WP menyeru qunut nazilah diteruskan (Bayan Linnas Siri 310, April 2025).
    - **Tidak boleh** dibaca ke atas sesama Muslim, termasuk kerana pertikaian politik (Al-Kafi #1993).
    - JAKIM menganjurkan solat hajat dan bacaan qunut nazilah di masjid utama pada 1 Mac 2026 (Kenyataan Media Bil. 04/2026). Pada Oktober 2026, seruan solat hajat dibuat untuk perlindungan Masjid al-Aqsa dan keselamatan negara daripada jerebu; qunut nazilah tidak disebut dalam seruan itu.

    Lafaz dalam app ini menggabungkan Qunut Umar (diberi sebagai contoh teks dalam Al-Kafi #969, bukan lafaz yang diwajibkan), doa ayat {{2:250}} dan dua doa Nabi ﷺ ketika berhadapan musuh (Sahih al-Bukhari 2933; Sunan Abi Dawud 1537).
  sumber:
    - {t: "Al-Kafi #969: Hukum Membaca Qunut Nazilah", p: "Pejabat Mufti WP, 19 Dis 2018", u: "https://www.muftiwp.gov.my/ms/artikel/al-kafi-li-al-fatawi/2895-al-kafi-969-hukum-membaca-qunut-nazilah"}
