- id: nisfu-syaaban
  tajuk: Yaasin Malam Nisfu Syaaban
  ringkas: "Buku ms 4: Yaasin 3 kali selepas Maghrib 15 Syaaban, setiap kali diikuti doa"
  nota: "[[nisfu-syaaban|Baca nota hukum Nisfu Syaaban]] sebelum mengamalkan susunan ini: tiada amalan khusus yang sabit; boleh diamalkan sebagai bacaan dan doa umum."
  langkah:
    - {doa: fatihah-hadiah}
    - {quran: "1:1-7", tajuk: "Surah al-Fatihah"}
    - {surah: 36, tajuk: "Yaasin (bacaan pertama)", nota: "Niat (dalam hati): memohon dipanjangkan umur dalam ketaatan"}
    - {doa: doa-nisfu-syaaban}
    - {surah: 36, tajuk: "Yaasin (bacaan kedua)", nota: "Niat: memohon ditetapkan iman dan mati dalam iman yang sempurna"}
    - {doa: doa-nisfu-syaaban}
    - {surah: 36, tajuk: "Yaasin (bacaan ketiga)", nota: "Niat: memohon dimurahkan rezeki yang halal"}
    - {doa: doa-nisfu-syaaban}
