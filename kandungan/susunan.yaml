# Susunan bacaan (mengikut buku "Surah Yaasiin, Tahlil & Doa").
# Setiap langkah: {doa: id} | {quran: "s:a-b", tajuk} | {surah: n}
# Pilihan langkah: ulang (bilangan), nota, bahagian: [indeks bahagian doa yang dipakai]

- id: yaasin
  tajuk: Bacaan Yaasin
  ringkas: "Kaifiat buku: istighfar, Fatihah, selawat 11 kali, Yaasin, enam surah pendek, Doa Yaasin"
  langkah:
    - {doa: istighfar-3}
    - {doa: fatihah-hadiah}
    - {quran: "1:1-7", tajuk: "Surah al-Fatihah"}
    - {doa: selawat-11}
    - {surah: 36}
    - {quran: "94:1-8", tajuk: "Surah al-Insyirah"}
    - {quran: "97:1-5", tajuk: "Surah al-Qadr"}
    - {quran: "105:1-5", tajuk: "Surah al-Fil"}
    - {quran: "112:1-4", tajuk: "Surah al-Ikhlas"}
    - {quran: "113:1-5", tajuk: "Surah al-Falaq"}
    - {quran: "114:1-6", tajuk: "Surah an-Nas"}
    - {doa: doa-selepas-yaasin}

