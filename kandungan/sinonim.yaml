# Kamus carian pintar: setiap baris ialah satu kumpulan istilah yang dianggap sama maksud semasa mencari.
# Istilah pertama ialah label yang dipaparkan ("Carian merangkumi: ..."). Frasa (lebih daripada satu perkataan) dipadankan
# sebagai frasa penuh. Ditulis dengan bantuan AI (Claude) berdasarkan tag doa, nota dan bahasa harian, kemudian disemak;
# tambah istilah baharu di sini, bukan dalam kod. bina.py menormalkan ejaan (huruf kecil, tanpa baris, tanpa ').
#
# Padanan sinonim diberi markah lebih rendah daripada padanan tepat, jadi kumpulan yang luas tidak menenggelamkan
# hasil yang tepat. Elakkan perkataan umum (malam, hari, baca) dalam kumpulan.

